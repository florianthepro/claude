[project]
name = "domainfinder"
version = "1.0.0"
description = "Findet verifiziert registrierbare Domainnamen (DoH -> RDAP -> Cloudflare Registrar)"
requires-python = ">=3.11"
dependencies = []          # ausschliesslich Standardbibliothek

[project.scripts]
domainfinder = "domainfinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["domainfinder*"]
