# Reverse proxy terminates TLS; the app never faces the network directly.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      DB_PATH: /app/data/citadel.sqlite
    volumes:
      - citadel-data:/app/data
    networks: [edge]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  edge:

volumes:
  citadel-data:
  caddy-data:
  caddy-config:
