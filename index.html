<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Editor</title>
<style>
  :root{
    --bg:#141416;
    --canvas-bg:#1b1b1e;
    --panel:#202024;
    --panel-2:#282830;
    --panel-3:#303038;
    --border:#3a3a42;
    --ink:#e6e6ea;
    --muted:#9a9aa6;
    --accent:#4a9eff;
    --accent-dim:#2b3b52;
    --tool-ctx:#2ea87a;
    --danger:#e05561;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--ink);
    overflow:hidden;user-select:none;-webkit-user-select:none;font-size:13px;
  }
  .app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;}

  /* ---- Top bar ---- */
  header.topbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);z-index:20;}
  .topbar .spacer{flex:1;}
  .iconbtn{
    border:1px solid var(--border);background:var(--panel-2);color:var(--ink);
    height:32px;min-width:32px;padding:0 10px;border-radius:6px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;
  }
  .iconbtn:hover{background:var(--panel-3);}
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn:disabled{opacity:.35;cursor:default;}
  .iconbtn.on{background:var(--accent-dim);border-color:var(--accent);color:#fff;}
  .iconbtn svg{width:16px;height:16px;}
  .bar-sep{width:1px;height:22px;background:var(--border);margin:0 4px;}

  /* ---- Options bar (contextual, Scratch-like) ---- */
  .optbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:6px 10px;min-height:46px;
    background:var(--panel);border-bottom:1px solid var(--border);z-index:19;
  }
  .opt-group{display:none;align-items:center;gap:6px;}
  .opt-group.on{display:flex;}
  .opt-label{font-size:11px;color:var(--muted);font-weight:700;}
  .swatch-btn{
    display:flex;align-items:center;gap:7px;
    border:1px solid var(--border);background:var(--panel-2);border-radius:6px;
    padding:5px 9px;cursor:pointer;color:var(--ink);font-size:12px;font-weight:600;height:32px;
  }
  .swatch-btn:hover{background:var(--panel-3);}
  .swatch-btn .sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.25);background:#fff;}
  .sw.none{background:linear-gradient(45deg,transparent 44%,#e05561 44%,#e05561 56%,transparent 56%),#fff !important;}
  .mini-num{
    width:60px;height:32px;border:1px solid var(--border);border-radius:6px;
    padding:0 7px;font-family:inherit;font-size:12px;color:var(--ink);background:var(--panel-2);
  }
  .mini-num:focus{outline:none;border-color:var(--accent);}
  .ctx-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:0 2px;}
  .ctx-chip .dot{width:9px;height:9px;border-radius:50%;}
  .ctx-chip.page .dot{background:var(--muted);}
  .ctx-chip.object .dot{background:var(--accent);}
  .ctx-chip.tool .dot{background:var(--tool-ctx);}
  .ctx-chip .close{border:none;background:transparent;color:var(--muted);cursor:pointer;width:20px;height:20px;border-radius:4px;font-size:13px;line-height:1;display:none;}
  .ctx-chip.object .close{display:block;}
  .ctx-chip .close:hover{background:rgba(255,255,255,.1);color:var(--ink);}

  /* ---- Color popover ---- */
  .color-pop{
    position:fixed;z-index:60;display:none;width:224px;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;
    box-shadow:0 10px 28px rgba(0,0,0,.55);
  }
  .color-pop.open{display:block;}
  .cp-row{display:flex;gap:6px;margin-bottom:9px;align-items:center;}
  .cp-none{
    flex:1;height:30px;border:1px solid var(--border);border-radius:6px;cursor:pointer;
    background:var(--panel-2);color:var(--ink);font-size:12px;font-weight:600;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .cp-none:hover{background:var(--panel-3);}
  .cp-none .sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,.2);}
  .cp-custom{width:44px;height:30px;border:1px solid var(--border);border-radius:6px;padding:2px;background:var(--panel-2);cursor:pointer;}
  .cp-swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cp-swatches button{aspect-ratio:1;border-radius:5px;border:1px solid rgba(255,255,255,.15);cursor:pointer;}
  .cp-swatches button:hover{outline:2px solid var(--accent);outline-offset:1px;}

  .workspace{display:grid;grid-template-columns:56px 1fr 250px;min-height:0;position:relative;}
  @media(max-width:820px){.workspace{grid-template-columns:48px 1fr;}.rightpanel{display:none;}}

  /* ---- Tool strip ---- */
  .toolbar{background:var(--panel);border-right:1px solid var(--border);padding:8px 6px;display:flex;flex-direction:column;gap:6px;align-items:center;overflow-y:auto;}
  .tool{width:42px;height:42px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;}
  .tool:hover{background:var(--panel-2);color:var(--ink);}
  .tool svg{width:23px;height:23px;pointer-events:none;}
  .tool.active{background:var(--accent);color:#fff;}
  .tool-sep{height:1px;width:60%;background:var(--border);margin:4px 0;}

  .flyout{
    position:absolute;left:62px;top:56px;z-index:40;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px;
    display:none;grid-template-columns:repeat(2,1fr);gap:6px;
    box-shadow:0 10px 28px rgba(0,0,0,.55);
  }
  .flyout.open{display:grid;}
  .flyout button{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:10px 6px;min-width:78px;
    background:var(--panel-2);border:1px solid transparent;border-radius:8px;
    color:var(--ink);cursor:pointer;font-size:11.5px;font-weight:600;font-family:inherit;
  }
  .flyout button:hover{background:var(--panel-3);border-color:var(--accent);}
  .flyout button svg{width:24px;height:24px;pointer-events:none;}

  /* ---- Canvas: no scrollbars, pan like Scratch ---- */
  .canvas-wrap{position:relative;background:var(--canvas-bg);overflow:hidden;min-height:0;}
  .canvas-view{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center;}
  .stage-pad{padding:40px;will-change:transform;}
  svg#canvas{background:#ffffff;box-shadow:0 0 0 1px #000, 0 8px 30px rgba(0,0,0,.5);display:block;touch-action:none;}

  .selbox{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;}
  .h-corner{fill:#fff;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke;}
  .h-rot{fill:var(--accent);stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;}
  .h-node{fill:#fff;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:move;}
  .h-line{stroke:var(--accent);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.7;}
  .handle{cursor:pointer;}

  .zoombar{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:1px;padding:3px;z-index:10;}
  .zoombar button{width:28px;height:28px;border:none;background:transparent;border-radius:5px;cursor:pointer;color:var(--ink);font-size:16px;font-weight:700;display:grid;place-items:center;}
  .zoombar button:hover{background:var(--panel-3);}
  .zoombar .zval{font-size:12px;font-weight:600;min-width:44px;text-align:center;color:var(--muted);}

  .text-edit{
    position:absolute;display:none;z-index:15;
    background:transparent;border:1.5px dashed var(--accent);border-radius:2px;
    outline:none;padding:0 2px;margin:0;min-width:30px;
    color:#000;white-space:pre;
  }
  .toast{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--border);color:var(--ink);
    padding:7px 14px;border-radius:7px;font-size:12.5px;z-index:30;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  /* ---- Right panel ---- */
  .rightpanel{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
  .ctx-head{
    display:flex;align-items:center;gap:8px;
    padding:10px 12px;font-size:13px;font-weight:700;
    border-bottom:1px solid var(--border);
  }
  .ctx-head .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .ctx-head.ctx-page{background:var(--panel-2);}
  .ctx-head.ctx-page .dot{background:var(--muted);}
  .ctx-head.ctx-object{background:var(--accent-dim);}
  .ctx-head.ctx-object .dot{background:var(--accent);}
  .ctx-head.ctx-tool{background:#22352d;}
  .ctx-head.ctx-tool .dot{background:var(--tool-ctx);}
  .ctx-head .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ctx-head .close{
    display:none;border:none;background:transparent;color:var(--muted);cursor:pointer;
    width:22px;height:22px;border-radius:5px;font-size:14px;line-height:1;
  }
  .ctx-head .close:hover{background:rgba(255,255,255,.1);color:var(--ink);}
  .ctx-head.ctx-object .close{display:block;}

  .panel-scroll{flex:1;overflow-y:auto;padding:12px;}
  .sec{margin-bottom:16px;display:none;}
  .sec.on{display:block;}
  .sec>.title{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:8px;}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .row>label{font-size:12px;color:var(--ink);flex:1;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--panel-3);flex:2;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:var(--accent);cursor:pointer;}
  .valnum{font-size:11px;font-weight:600;color:var(--muted);min-width:30px;text-align:right;}
  select{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 8px;font-family:inherit;font-size:12px;color:var(--ink);background:var(--panel-2);cursor:pointer;}
  select:focus{outline:none;border-color:var(--accent);}
  .num2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
  .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .abtn{border:1px solid var(--border);background:var(--panel-2);color:var(--ink);padding:8px 6px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit;}
  .abtn:hover{background:var(--panel-3);}
  .abtn:active{transform:translateY(1px);}
  .abtn.danger{color:var(--danger);border-color:#4a2a2e;}
  .abtn.danger:hover{background:#3a2226;}
  .abtn.full{grid-column:1/3;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;color:var(--ink);margin-bottom:9px;}
  .checkbox-row input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}

  .sec-layers{border-top:1px solid var(--border);padding:12px;max-height:38%;display:flex;flex-direction:column;}
  .sec-layers>.title{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:8px;flex:none;}
  .layers{display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
  .layer-item{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:6px;background:var(--panel-2);border:1px solid transparent;cursor:pointer;font-size:12px;flex:none;}
  .layer-item:hover{background:var(--panel-3);}
  .layer-item.sel{border-color:var(--accent);background:var(--accent-dim);}
  .layer-item .lswatch{width:15px;height:15px;border-radius:4px;border:1px solid rgba(255,255,255,.2);flex:none;}
  .layer-item .lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
  .layer-item .lbtn{border:none;background:none;cursor:pointer;color:var(--muted);padding:2px;border-radius:4px;display:grid;place-items:center;}
  .layer-item .lbtn:hover{background:rgba(255,255,255,.1);color:var(--ink);}
  .layer-item .lbtn svg{width:14px;height:14px;}
  .empty{color:var(--muted);font-size:12px;text-align:center;padding:14px 0;}
  input[type=file]{display:none;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#44444e;border-radius:6px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:#55555f;background-clip:content-box;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="iconbtn" id="undoBtn" title="Rückgängig (Strg+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
    </button>
    <button class="iconbtn" id="redoBtn" title="Wiederholen (Strg+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg>
    </button>
    <div class="bar-sep"></div>
    <button class="iconbtn on" id="gridBtn" title="Raster anzeigen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M12 4v16M4 12h16"/></svg>
    </button>
    <button class="iconbtn" id="snapBtn" title="Einrasten: wirkt auf alle Aktionen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M6 3h4M14 3h4"/></svg>
      <span id="snapLabel">Aus</span>
    </button>
    <div class="spacer"></div>
    <button class="iconbtn" id="importBtn">Öffnen</button>
    <button class="iconbtn" id="exportSvgBtn">SVG</button>
    <button class="iconbtn" id="exportPngBtn">PNG</button>
    <input type="file" id="fileInput" accept=".svg,image/svg+xml">
  </header>

  <!-- Contextual options bar -->
  <div class="optbar">
    <div class="ctx-chip page" id="ctxChip">
      <span class="dot"></span>
      <span id="ctxChipLabel">Seite</span>
      <button class="close" id="ctxClose" title="Auswahl aufheben (Esc)">✕</button>
    </div>

    <div class="opt-group" id="gFill">
      <button class="swatch-btn" id="fillBtn"><span class="sw" id="fillSw"></span>Füllung</button>
    </div>
    <div class="opt-group" id="gStroke">
      <button class="swatch-btn" id="strokeBtn"><span class="sw" id="strokeSw"></span>Kontur</button>
      <span class="opt-label">Breite</span>
      <input class="mini-num" id="strokeWidth" type="number" min="0" max="100" step="0.5" value="0">
    </div>

    <div class="opt-group" id="gObj">
      <span class="opt-label">X</span><input class="mini-num" id="objX" type="number">
      <span class="opt-label">Y</span><input class="mini-num" id="objY" type="number">
      <span class="opt-label">B</span><input class="mini-num" id="objW" type="number" min="1">
      <span class="opt-label">H</span><input class="mini-num" id="objH" type="number" min="1">
      <span class="opt-label">°</span><input class="mini-num" id="objRot" type="number" step="1" style="width:52px;">
    </div>

    <div class="opt-group" id="gPage">
      <button class="swatch-btn" id="bgBtn"><span class="sw none" id="bgSw"></span>Hintergrund</button>
      <span class="opt-label">B</span><input class="mini-num" id="canvasW" type="number" value="800" min="1">
      <span class="opt-label">H</span><input class="mini-num" id="canvasH" type="number" value="600" min="1">
    </div>
  </div>

  <div class="workspace">
    <!-- Tools -->
    <nav class="toolbar" id="toolbar">
      <button class="tool active" data-tool="select" title="Greifer (V)">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5.5 3l13 9.5-6.2 1.2 3.4 6.3-2.7 1.4-3.4-6.4-4.1 4z"/></svg>
      </button>
      <button class="tool" id="insertBtn" title="Einfügen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="tool-sep"></div>
      <button class="tool" data-tool="node" title="Punkte verschieben (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17C9 7 15 7 19 17"/><rect x="3" y="15" width="4" height="4" rx="1" fill="currentColor" stroke="none"/><rect x="17" y="15" width="4" height="4" rx="1" fill="currentColor" stroke="none"/></svg>
      </button>
    </nav>
    <div class="flyout" id="flyout">
      <button data-tool="rect"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" fill="currentColor"/></svg>Rechteck</button>
      <button data-tool="ellipse"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>Kreis</button>
      <button data-tool="line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 19L19 5"/></svg>Linie</button>
      <button data-tool="polygon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l2.9 5.9 6.6 1-4.8 4.6 1.2 6.5-5.9-3.1-5.9 3.1 1.2-6.5L2.5 9.4l6.6-1z"/></svg>Stern</button>
      <button data-tool="pen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 17C8 7 16 7 20 17"/><circle cx="4" cy="17" r="2" fill="currentColor" stroke="none"/><circle cx="20" cy="17" r="2" fill="currentColor" stroke="none"/></svg>Kurve</button>
      <button data-tool="pencil"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4.5 19.5l1-4 10-10 3 3-10 10-4 1z"/></svg>Stift</button>
      <button data-tool="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19L12 5l5 14M8.8 14.5h6.4"/></svg>Text</button>
    </div>

    <!-- Canvas -->
    <div class="canvas-wrap" id="canvasWrap">
      <div class="canvas-view" id="canvasView">
        <div class="stage-pad" id="stagePad"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div>
      </div>
      <input class="text-edit" id="textEdit" spellcheck="false">
      <div class="zoombar">
        <button id="zoomOut" title="Verkleinern">−</button>
        <span class="zval" id="zoomVal">100%</span>
        <button id="zoomIn" title="Vergrößern">+</button>
        <button id="zoomFit" title="Einpassen" style="font-size:13px;">⤢</button>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <!-- Right panel -->
    <aside class="rightpanel">
      <div class="ctx-head ctx-page" id="ctxHead">
        <span class="dot"></span>
        <span class="label" id="ctxLabel">Seite</span>
        <button class="close" id="ctxClose2" title="Auswahl aufheben (Esc)">✕</button>
      </div>
      <div class="panel-scroll">

        <div class="sec" id="secDraw">
          <div class="title">Zeichnen</div>
          <label class="checkbox-row"><input type="checkbox" id="keepDrawing"> Weiter zeichnen</label>
        </div>

        <div class="sec" id="secOpacity">
          <div class="title">Deckkraft</div>
          <div class="row">
            <input type="range" id="opacity" min="0" max="100" step="1" value="100">
            <span class="valnum" id="opacityVal">100</span>
          </div>
        </div>

        <div class="sec" id="secCorner">
          <div class="title">Ecken runden</div>
          <div class="row">
            <input type="range" id="cornerRadius" min="0" max="200" step="1" value="0">
            <span class="valnum" id="cornerRadiusVal">0</span>
          </div>
        </div>

        <div class="sec" id="secPoly">
          <div class="title">Stern &amp; Vieleck</div>
          <div class="row">
            <label>Ecken</label>
            <input type="range" id="polySides" min="3" max="16" step="1" value="5">
            <span class="valnum" id="polySidesVal">5</span>
          </div>
          <label class="checkbox-row"><input type="checkbox" id="polyStar" checked> Als Stern</label>
        </div>

        <div class="sec" id="secText">
          <div class="title">Schrift</div>
          <div class="row">
            <label>Größe</label>
            <input type="range" id="fontSize" min="6" max="300" step="1" value="40">
            <span class="valnum" id="fontSizeVal">40</span>
          </div>
          <div class="num2">
            <select id="fontFamily">
              <option value="sans-serif">Sans-serif</option>
              <option value="serif">Serif</option>
              <option value="monospace">Monospace</option>
              <option value="Georgia, serif">Georgia</option>
              <option value="Impact, sans-serif">Impact</option>
              <option value="'Courier New', monospace">Courier</option>

              <option value="400">Normal</option>
              <option value="700">Fett</option>
              <option value="300">Dünn</option>
            </select>
          </div>
          <button class="abtn full" id="editTextBtn" style="width:100%;display:none;">Text ändern</button>
        </div>

        <div class="sec" id="secArrange">
          <div class="title">Anordnen</div>
          <div class="btn-grid">
            <button class="abtn" id="frontBtn">Nach vorne</button>
            <button class="abtn" id="backBtn">Nach hinten</button>
            <button class="abtn" id="fwdBtn">Vorwärts</button>
            <button class="abtn" id="bwdBtn">Rückwärts</button>
            <button class="abtn" id="flipHBtn">↔ Spiegeln</button>
            <button class="abtn" id="flipVBtn">↕ Spiegeln</button>
          </div>

        <div class="sec" id="secActions">
          <div class="title">Aktionen</div>
          <div class="btn-grid">
            <button class="abtn" id="dupBtn">Duplizieren</button>
            <button class="abtn danger" id="delBtn">Löschen</button>

        <div class="sec" id="secPageClear">
          <button class="abtn danger full" id="clearBtn" style="width:100%;">Alles löschen</button>
        </div>

      </div>

      <div class="sec-layers">
        <div class="title">Ebenen</div>

<!-- Color popover -->
<div class="color-pop" id="colorPop">
  <div class="cp-row">
    <button class="cp-none" id="cpNone"><span class="sw none"></span>Keine</button>
    <input type="color" class="cp-custom" id="cpCustom" title="Eigene Farbe">
  </div>
  <div class="cp-swatches" id="cpSwatches"></div>
</div>

<script>
"use strict";
(function(){
  const SVGNS="http://www.w3.org/2000/svg";
  const svg=document.getElementById('canvas');
  const view=document.getElementById('canvasView');
  const stage=document.getElementById('stagePad');
  const wrap=document.getElementById('canvasWrap');
  const $=id=>document.getElementById(id);

  let state={
    w:800,h:600,bg:'#ffffff',bgOn:false,zoom:1,tool:'select',
    fill:'#4a9eff',fillOn:true,stroke:'#141416',strokeOn:false,strokeWidth:0,
    opacity:1,corner:0,polySides:5,polyStar:true,
    fontSize:40,fontFamily:'sans-serif',fontWeight:'400',
    grid:true,snapMode:'off',
    keep:{rect:false,ellipse:false,line:false,polygon:false,pen:false,pencil:true,text:false},
  };
  const DRAW_TOOLS=['rect','ellipse','line','polygon','pen','pencil','text'];
  const NODE_TAGS=['path','polygon','polyline','line','ellipse','circle'];
  let selected=null,idc=1,action=null,pen=null,editing=null;
  const undoStack=[],redoStack=[];

  function mk(tag,attrs){const el=document.createElementNS(SVGNS,tag);if(attrs)for(const k in attrs)el.setAttribute(k,attrs[k]);return el;}
  function uid(){return 's'+(idc++);}
  function round(n){return Math.round(n*100)/100;}
  function fmt(n){return Math.round(n*10)/10;}

  const gGrid=mk('g',{id:'__grid'}),gContent=mk('g',{id:'__content'}),gOverlay=mk('g',{id:'__overlay'});
  let bgRect=null;
  svg.appendChild(gGrid);svg.appendChild(gContent);svg.appendChild(gOverlay);

  let toastTimer=null;
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}

  // ---- canvas / grid / bg ----
  function applyCanvasSize(){
    svg.setAttribute('width',state.w*state.zoom);
    svg.setAttribute('height',state.h*state.zoom);
    svg.setAttribute('viewBox',`0 0 ${state.w} ${state.h}`);
    drawGrid();updateBg();updateOverlay();
  }
  function updateBg(){
    if(state.bgOn){
      if(!bgRect){bgRect=mk('rect',{id:'__bg'});svg.insertBefore(bgRect,gContent);}
      bgRect.setAttribute('x',0);bgRect.setAttribute('y',0);
      bgRect.setAttribute('width',state.w);bgRect.setAttribute('height',state.h);
      bgRect.setAttribute('fill',state.bg);
    }else if(bgRect){bgRect.remove();bgRect=null;}
  }
  // Adaptive checkerboard base grid: nearest 1/2/5*10^n step keeps cells
  // readable at any zoom; zoomed far in the step reaches 1 = pixel grid.
  function gridStep(){
    const seq=[1,2,5];let mag=1,i=0;
    while(seq[i]*mag*state.zoom<12){i++;if(i===3){i=0;mag*=10;}}
    return seq[i]*mag;
  }
  function drawGrid(){
    gGrid.innerHTML='';if(!state.grid)return;
    const s=gridStep();
    const defs=mk('defs');
    const pat=mk('pattern',{id:'__checker',width:s*2,height:s*2,patternUnits:'userSpaceOnUse'});
    pat.appendChild(mk('rect',{x:0,y:0,width:s,height:s,fill:'#e9e9ef'}));
    pat.appendChild(mk('rect',{x:s,y:s,width:s,height:s,fill:'#e9e9ef'}));
    defs.appendChild(pat);
    gGrid.appendChild(defs);
    gGrid.appendChild(mk('rect',{x:0,y:0,width:state.w,height:state.h,fill:'url(#__checker)'}));
  }

  function svgPoint(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/state.zoom,y:(e.clientY-r.top)/state.zoom};}
  function snap(v){
    if(state.snapMode==='pixel')return Math.round(v);
    if(state.snapMode==='grid'){const s=gridStep();return Math.round(v/s)*s;}
    return v;
  }
  function snapPt(p){return{x:snap(p.x),y:snap(p.y)};}
  function bbox(el){try{return el.getBBox();}catch(e){return{x:0,y:0,width:0,height:0};}}
  function copyBox(el){const b=bbox(el);return{x:b.x,y:b.y,width:b.width,height:b.height};}
  function getRot(el){return parseFloat(el.dataset.rot||'0');}
  function setRot(el,deg,cx,cy){el.dataset.rot=deg;if(deg)el.setAttribute('transform',`rotate(${deg} ${cx} ${cy})`);else el.removeAttribute('transform');}

  // ---- undo ----
  function snapshot(){return gContent.innerHTML;}
  let lastUndoKey=null,lastUndoTime=0;
  function pushUndo(key){
    const now=Date.now();
    if(key && key===lastUndoKey && now-lastUndoTime<900){lastUndoTime=now;return;}
    lastUndoKey=key||null;lastUndoTime=now;
    undoStack.push(snapshot());
    if(undoStack.length>100)undoStack.shift();
    redoStack.length=0;updateUndoButtons();
  }
  function restore(html){deselect();gContent.innerHTML=html;renderLayers();updateUndoButtons();}
  function undo(){if(!undoStack.length)return;commitTextEdit();redoStack.push(snapshot());restore(undoStack.pop());lastUndoKey=null;}
  function redo(){if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop());lastUndoKey=null;}
  function updateUndoButtons(){$('undoBtn').disabled=!undoStack.length;$('redoBtn').disabled=!redoStack.length;}

  // ---- selection ----
  function deselect(){if(!selected)return void updateContext();selected=null;updateOverlay();renderLayers();updateContext();}
  function select(el){selected=el;updateOverlay();renderLayers();updateContext();}

  function updateOverlay(){
    gOverlay.innerHTML='';
    if(!selected)return;
    if(state.tool==='node' && NODE_TAGS.includes(selected.tagName)){drawNodes();return;}
    const b=bbox(selected),rot=getRot(selected);
    const cx=b.x+b.width/2,cy=b.y+b.height/2;
    const g=mk('g');
    if(rot)g.setAttribute('transform',`rotate(${rot} ${cx} ${cy})`);
    g.appendChild(mk('rect',{class:'selbox',x:b.x,y:b.y,width:b.width,height:b.height}));
    const hs=5/state.zoom;
    [['nw',b.x,b.y],['ne',b.x+b.width,b.y],['se',b.x+b.width,b.y+b.height],['sw',b.x,b.y+b.height],
     ['n',cx,b.y],['s',cx,b.y+b.height],['e',b.x+b.width,cy],['w',b.x,cy]].forEach(([pos,x,y])=>{
      const h=mk('rect',{class:'h-corner handle',x:x-hs,y:y-hs,width:hs*2,height:hs*2});
      h.dataset.handle=pos;
      h.style.cursor=(pos==='nw'||pos==='se')?'nwse-resize':(pos==='ne'||pos==='sw')?'nesw-resize':(pos==='n'||pos==='s')?'ns-resize':'ew-resize';
      g.appendChild(h);
    });
    const ry=b.y-24/state.zoom;
    g.appendChild(mk('line',{class:'h-line',x1:cx,y1:b.y,x2:cx,y2:ry}));
    const rh=mk('circle',{class:'h-rot handle',cx:cx,cy:ry,r:hs+1});
    rh.dataset.handle='rotate';rh.style.cursor='grab';
    g.appendChild(rh);
    gOverlay.appendChild(g);
  }

  // ---- node editing (paths, polygons, lines and circles/ellipses) ----
  function drawNodes(){
    const pts=extractPoints(selected);if(!pts)return;const g=mk('g');
    pts.forEach((p,i)=>{const h=mk('circle',{class:'h-node handle',cx:p.x,cy:p.y,r:5.5/state.zoom});h.dataset.node=i;g.appendChild(h);});
    gOverlay.appendChild(g);
  }
  function extractPoints(el){
    if(el.tagName==='polygon'||el.tagName==='polyline')
      return (el.getAttribute('points')||'').trim().split(/\s+/).map(pr=>{const[a,b]=pr.split(',').map(Number);return{x:a,y:b};}).filter(p=>!isNaN(p.x));
    if(el.tagName==='line')return[{x:+el.getAttribute('x1'),y:+el.getAttribute('y1')},{x:+el.getAttribute('x2'),y:+el.getAttribute('y2')}];
    if(el.tagName==='path')return parsePathNodes(el.getAttribute('d'));
    if(el.tagName==='ellipse'){
      const cx=+el.getAttribute('cx'),cy=+el.getAttribute('cy');
      return[{x:cx+(+el.getAttribute('rx')),y:cy},{x:cx,y:cy+(+el.getAttribute('ry'))}];
    }
    if(el.tagName==='circle'){
      const cx=+el.getAttribute('cx'),cy=+el.getAttribute('cy');
      return[{x:cx+(+el.getAttribute('r')),y:cy}];
    }
    return null;
  }
  function parsePathNodes(d){
    const nodes=[],re=/([MLCQ])([^MLCQZz]*)/g;let m;
    while((m=re.exec(d))){const c=m[1],n=(m[2].match(/-?\d*\.?\d+/g)||[]).map(Number);
      if(c==='M'||c==='L')nodes.push({x:n[0],y:n[1]});
      else if(c==='C')nodes.push({x:n[4],y:n[5]});
      else if(c==='Q')nodes.push({x:n[2],y:n[3]});}
    return nodes;
  }
  function setNode(el,idx,p){
    if(el.tagName==='polygon'||el.tagName==='polyline'){const pts=extractPoints(el);pts[idx]=p;el.setAttribute('points',pts.map(q=>`${round(q.x)},${round(q.y)}`).join(' '));}
    else if(el.tagName==='line'){if(idx===0){el.setAttribute('x1',round(p.x));el.setAttribute('y1',round(p.y));}else{el.setAttribute('x2',round(p.x));el.setAttribute('y2',round(p.y));}}
    else if(el.tagName==='path')movePathNode(el,idx,p);
    else if(el.tagName==='ellipse'){
      const cx=+el.getAttribute('cx'),cy=+el.getAttribute('cy');
      if(idx===0)el.setAttribute('rx',round(Math.max(1,Math.abs(p.x-cx))));
      else el.setAttribute('ry',round(Math.max(1,Math.abs(p.y-cy))));
    }
    else if(el.tagName==='circle'){
      const cx=+el.getAttribute('cx'),cy=+el.getAttribute('cy');
      el.setAttribute('r',round(Math.max(1,Math.hypot(p.x-cx,p.y-cy))));
    }
  }
  function movePathNode(el,idx,p){
    const re=/([MLCQ])([^MLCQZz]*)/g,parts=[];let m,d=el.getAttribute('d');
    while((m=re.exec(d)))parts.push({cmd:m[1],nums:(m[2].match(/-?\d*\.?\d+/g)||[]).map(Number)});
    let count=-1;
    for(const part of parts){if('MLCQ'.includes(part.cmd))count++;if(count===idx){const n=part.nums;
      if(part.cmd==='M'||part.cmd==='L'){n[0]=p.x;n[1]=p.y;}else if(part.cmd==='C'){n[4]=p.x;n[5]=p.y;}else if(part.cmd==='Q'){n[2]=p.x;n[3]=p.y;}break;}}
    let out='';for(const part of parts)out+=part.cmd+part.nums.map(round).join(' ')+' ';
    if(/[Zz]\s*$/.test(el.getAttribute('d')))out+='Z';
    el.setAttribute('d',out.trim());
  }

  // ---- style ----
  function applyStyleAttrs(el){
    el.setAttribute('fill',state.fillOn?state.fill:'none');
    if(state.strokeOn){el.setAttribute('stroke',state.stroke);el.setAttribute('stroke-width',state.strokeWidth);el.setAttribute('stroke-linejoin','round');el.setAttribute('stroke-linecap','round');}
    else{el.setAttribute('stroke','none');el.removeAttribute('stroke-width');}
    el.setAttribute('opacity',state.opacity);
  }
  function styleChanged(key){
    if(!selected)return;
    pushUndo(key);
    const el=selected;
    if((el.tagName==='line'||(el.tagName==='path'&&!state.fillOn))&&(!state.strokeOn||state.strokeWidth<1)){
      state.strokeOn=true;
      if(state.strokeWidth<1)state.strokeWidth=1;
      syncStyleControls();
    }
    el.setAttribute('fill',state.fillOn?state.fill:'none');
    if(state.strokeOn){el.setAttribute('stroke',state.stroke);el.setAttribute('stroke-width',state.strokeWidth);el.setAttribute('stroke-linejoin','round');el.setAttribute('stroke-linecap','round');}
    else el.setAttribute('stroke','none');
    el.setAttribute('opacity',state.opacity);
    if(el.tagName==='rect')el.setAttribute('rx',state.corner);
    renderLayers();
  }

  // ---- pointer ----
  svg.addEventListener('pointerdown',onDown);
  svg.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);

  function onDown(e){
    if(editing)return;
    if(e.button===1)return; // middle mouse pans
    const p=svgPoint(e);
    try{svg.setPointerCapture(e.pointerId);}catch(_){}
    const handleEl=e.target.closest('.handle');
    if(handleEl&&selected){
      if(handleEl.dataset.node!==undefined){pushUndo();action={type:'node',idx:+handleEl.dataset.node};return;}
      const h=handleEl.dataset.handle;pushUndo();
      if(h==='rotate'){const b=bbox(selected);action={type:'rotate',cx:b.x+b.width/2,cy:b.y+b.height/2,startRot:getRot(selected),startAng:Math.atan2(p.y-(b.y+b.height/2),p.x-(b.x+b.width/2))};}
      else{
        const b=copyBox(selected);
        if(selected.tagName==='polygon'||selected.tagName==='polyline')b.points=selected.getAttribute('points');
        if(selected.tagName==='path')b.d=selected.getAttribute('d');
        if(selected.tagName==='text')b.fontSize=+selected.getAttribute('font-size')||40;
        if(selected.tagName==='line')b.line={x1:+selected.getAttribute('x1'),y1:+selected.getAttribute('y1'),x2:+selected.getAttribute('x2'),y2:+selected.getAttribute('y2')};
        action={type:'resize',handle:h,b:b};
      }
      return;
    }
    if(state.tool==='select'){
      const t=e.target.closest('#__content > *');
      if(t){if(t!==selected)select(t);action={type:'move',start:p,orig:captureGeom(t),moved:false};}
      else deselect();
      return;
    }
    if(state.tool==='node'){
      const t=e.target.closest('#__content > *');
      if(t){if(NODE_TAGS.includes(t.tagName)&&t!==selected)select(t);}
      else deselect();
      return;
    }
    if(state.tool==='pen'){penDown(p);return;}
    if(state.tool==='pencil'){pencilDown(p);return;}
    if(state.tool==='text'){e.preventDefault();placeText(p);return;}
    // shape create
    pushUndo();
    const s=snapPt(p);let el;
    if(state.tool==='rect')el=mk('rect',{x:s.x,y:s.y,width:0,height:0,rx:state.corner});
    else if(state.tool==='ellipse')el=mk('ellipse',{cx:s.x,cy:s.y,rx:0,ry:0});
    else if(state.tool==='line')el=mk('line',{x1:s.x,y1:s.y,x2:s.x,y2:s.y});
    else if(state.tool==='polygon'){el=mk('polygon',{points:`${s.x},${s.y}`});if(state.polyStar)el.dataset.star='1';}
    if(!el)return;el.id=uid();applyStyleAttrs(el);
    if(state.tool==='line'&&!state.strokeOn){el.setAttribute('stroke',state.stroke);el.setAttribute('stroke-width',state.strokeWidth||3);}
    gContent.appendChild(el);select(el);
    action={type:'create',tool:state.tool,start:s,el};
  }

  function onMove(e){
    if(pen)penPreview(e);
    if(!action)return;
    const p=svgPoint(e),sp=snapPt(p);
    if(action.type==='create'){
      const el=action.el,s=action.start;
      if(action.tool==='rect'){let x=Math.min(s.x,sp.x),y=Math.min(s.y,sp.y),w=Math.abs(sp.x-s.x),h=Math.abs(sp.y-s.y);if(e.shiftKey){const m=Math.max(w,h);w=h=m;}el.setAttribute('x',round(x));el.setAttribute('y',round(y));el.setAttribute('width',round(w));el.setAttribute('height',round(h));}
      else if(action.tool==='ellipse'){let rx=Math.abs(sp.x-s.x)/2,ry=Math.abs(sp.y-s.y)/2;if(e.shiftKey){const m=Math.max(rx,ry);rx=ry=m;}el.setAttribute('cx',round(s.x+(sp.x-s.x)/2));el.setAttribute('cy',round(s.y+(sp.y-s.y)/2));el.setAttribute('rx',round(rx));el.setAttribute('ry',round(ry));}
      else if(action.tool==='line'){let ex=sp.x,ey=sp.y;if(e.shiftKey){const dx=ex-s.x,dy=ey-s.y,ang=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4),len=Math.hypot(dx,dy);ex=s.x+Math.cos(ang)*len;ey=s.y+Math.sin(ang)*len;}el.setAttribute('x2',round(ex));el.setAttribute('y2',round(ey));}
      else if(action.tool==='polygon'){const rad=Math.hypot(sp.x-s.x,sp.y-s.y),rot=Math.atan2(sp.y-s.y,sp.x-s.x);el.setAttribute('points',polyPoints(s.x,s.y,rad,state.polySides,rot,state.polyStar));}
      updateOverlay();return;
    }
    if(action.type==='move'){
      let dx=p.x-action.start.x,dy=p.y-action.start.y;
      if(!action.moved&&Math.hypot(dx,dy)>0.5){action.moved=true;pushUndo();}
      if(!action.moved)return;
      if(state.snapMode!=='off'){dx=snap(dx);dy=snap(dy);}
      applyGeom(selected,action.orig,dx,dy);updateOverlay();return;
    }
    if(action.type==='resize'){doResize(p,e.shiftKey);updateOverlay();return;}
    if(action.type==='rotate'){const ang=Math.atan2(p.y-action.cy,p.x-action.cx);let deg=action.startRot+(ang-action.startAng)*180/Math.PI;if(e.shiftKey)deg=Math.round(deg/15)*15;setRot(selected,round(deg),action.cx,action.cy);updateOverlay();return;}
    if(action.type==='node'){setNode(selected,action.idx,sp);updateOverlay();return;}
    if(action.type==='pencil'){action.pts.push(p);selected.setAttribute('d',smoothPath(action.pts));return;}
  }

  function onUp(){
    if(!action)return;
    const a=action;action=null;
    if(a.type==='create'){
      const b=bbox(a.el);
      if(a.tool==='line'){if(a.el.getAttribute('x1')===a.el.getAttribute('x2')&&a.el.getAttribute('y1')===a.el.getAttribute('y2')){a.el.remove();deselect();}}
      else if(b.width<2&&b.height<2){a.el.remove();deselect();}
      renderLayers();
      if(a.el.isConnected)maybeReturnToSelect();
    }
    if(a.type==='pencil'){
      if(a.pts.length<2){selected.remove();deselect();}
      else{
        const f=a.pts[0],l=a.pts[a.pts.length-1];
        if(a.pts.length>2&&Math.hypot(l.x-f.x,l.y-f.y)<20/state.zoom){
          selected.setAttribute('d',smoothPath(a.pts)+' Z');
          state.fillOn=true;
          selected.setAttribute('fill',state.fill);
          syncStyleControls();
          updateOverlay();
        }
        renderLayers();
        maybeReturnToSelect();
      }
      renderLayers();
    }
    syncObjFields();syncStyleControls();
  }

  // ---- geometry ----
  function captureGeom(el){
    const t=el.tagName,g={};
    if(t==='rect'||t==='image'||t==='text')g.x=+el.getAttribute('x'),g.y=+el.getAttribute('y');
    else if(t==='ellipse'||t==='circle')g.cx=+el.getAttribute('cx'),g.cy=+el.getAttribute('cy');
    else if(t==='line')g.x1=+el.getAttribute('x1'),g.y1=+el.getAttribute('y1'),g.x2=+el.getAttribute('x2'),g.y2=+el.getAttribute('y2');
    else if(t==='polygon'||t==='polyline')g.points=el.getAttribute('points');
    else if(t==='path')g.d=el.getAttribute('d');
    g.rot=getRot(el);return g;
  }
  function applyGeom(el,g,dx,dy){
    const t=el.tagName;
    if(t==='rect'||t==='image'||t==='text'){el.setAttribute('x',round(g.x+dx));el.setAttribute('y',round(g.y+dy));}
    else if(t==='ellipse'||t==='circle'){el.setAttribute('cx',round(g.cx+dx));el.setAttribute('cy',round(g.cy+dy));}
    else if(t==='line'){el.setAttribute('x1',round(g.x1+dx));el.setAttribute('y1',round(g.y1+dy));el.setAttribute('x2',round(g.x2+dx));el.setAttribute('y2',round(g.y2+dy));}
    else if(t==='polygon'||t==='polyline')el.setAttribute('points',g.points.trim().split(/\s+/).map(pr=>{const[a,b]=pr.split(',').map(Number);return`${round(a+dx)},${round(b+dy)}`;}).join(' '));
    else if(t==='path')el.setAttribute('d',translatePath(g.d,dx,dy));
    if(g.rot){const b=bbox(el);setRot(el,g.rot,b.x+b.width/2,b.y+b.height/2);}
  }
  function translatePath(d,dx,dy){let i=0;return d.replace(/-?\d*\.?\d+/g,n=>{const v=parseFloat(n),r=(i%2===0)?v+dx:v+dy;i++;return round(r);});}

  function doResize(p,ratio){
    const el=selected,h=action.handle,b=action.b;
    let x1=b.x,y1=b.y,x2=b.x+b.width,y2=b.y+b.height;
    if(h.includes('w'))x1=p.x;if(h.includes('e'))x2=p.x;if(h.includes('n'))y1=p.y;if(h.includes('s'))y2=p.y;
    let nx=Math.min(x1,x2),ny=Math.min(y1,y2),nw=Math.abs(x2-x1),nh=Math.abs(y2-y1);
    if(ratio&&b.width&&b.height){const r=b.width/b.height;if(nw/nh>r)nw=nh*r;else nh=nw/r;}
    if(nw<1)nw=1;if(nh<1)nh=1;
    scaleTo(el,b,nx,ny,nw,nh);
  }
  // b must carry the ORIGINAL geometry (points/d/fontSize/line) captured at
  // drag start so repeated calls do not compound.
  function scaleTo(el,b,nx,ny,nw,nh){
    const sx=b.width?nw/b.width:1,sy=b.height?nh/b.height:1,t=el.tagName;
    const fx=x=>nx+(x-b.x)*sx,fy=y=>ny+(y-b.y)*sy;
    if(t==='rect'){el.setAttribute('x',round(nx));el.setAttribute('y',round(ny));el.setAttribute('width',round(nw));el.setAttribute('height',round(nh));}
    else if(t==='ellipse'){el.setAttribute('cx',round(nx+nw/2));el.setAttribute('cy',round(ny+nh/2));el.setAttribute('rx',round(nw/2));el.setAttribute('ry',round(nh/2));}
    else if(t==='circle'){el.setAttribute('cx',round(nx+nw/2));el.setAttribute('cy',round(ny+nh/2));el.setAttribute('r',round(Math.min(nw,nh)/2));}
    else if(t==='line'){
      const L=b.line||{x1:+el.getAttribute('x1'),y1:+el.getAttribute('y1'),x2:+el.getAttribute('x2'),y2:+el.getAttribute('y2')};
      el.setAttribute('x1',round(fx(L.x1)));el.setAttribute('y1',round(fy(L.y1)));
      el.setAttribute('x2',round(fx(L.x2)));el.setAttribute('y2',round(fy(L.y2)));
    }
    else if(t==='text'){
      const base=b.fontSize||+el.getAttribute('font-size')||40;
      const s=(b.height&&Math.abs(sy-1)>1e-9)?sy:sx;
      el.setAttribute('font-size',Math.max(1,round(base*s)));
      const nb=bbox(el);
      el.setAttribute('x',round(+el.getAttribute('x')+nx-nb.x));
      el.setAttribute('y',round(+el.getAttribute('y')+ny-nb.y));
    }
    else if(t==='polygon'||t==='polyline')el.setAttribute('points',(b.points||el.getAttribute('points')).trim().split(/\s+/).map(pr=>{const[a,c]=pr.split(',').map(Number);return`${round(fx(a))},${round(fy(c))}`;}).join(' '));
    else if(t==='path')el.setAttribute('d',scalePath(b.d||el.getAttribute('d'),fx,fy));
    if(getRot(el))setRot(el,getRot(el),nx+nw/2,ny+nh/2);
  }
  function scalePath(d,fx,fy){let i=0;return d.replace(/-?\d*\.?\d+/g,n=>{const v=parseFloat(n),r=(i%2===0)?fx(v):fy(v);i++;return round(r);});}

  function polyPoints(cx,cy,r,sides,rot,star){
    let pts=[];const n=star?sides*2:sides;
    for(let i=0;i<n;i++){const rad=(star&&i%2)?r*0.42:r,a=rot-Math.PI/2+i*2*Math.PI/n;pts.push(`${round(cx+Math.cos(a)*rad)},${round(cy+Math.sin(a)*rad)}`);}
    return pts.join(' ');
  }

  // ---- pen ----
  function penDown(p){
    const sp=snapPt(p);
    if(!pen){pushUndo();const el=mk('path',{d:`M ${sp.x} ${sp.y}`});el.id=uid();applyStyleAttrs(el);if(!state.strokeOn){el.setAttribute('stroke',state.stroke);el.setAttribute('stroke-width',state.strokeWidth||3);}gContent.appendChild(el);pen={el,pts:[sp]};select(el);}
    else{const first=pen.pts[0];if(Math.hypot(sp.x-first.x,sp.y-first.y)<8){finishPen(true);return;}pen.pts.push(sp);rebuildPen(false);}
  }
  function rebuildPen(close){
    let d=`M ${pen.pts[0].x} ${pen.pts[0].y}`;
    for(let i=1;i<pen.pts.length;i++)d+=` L ${pen.pts[i].x} ${pen.pts[i].y}`;
    if(close)d+=' Z';
    pen.el.setAttribute('d',d);updateOverlay();
  }
  function penPreview(e){const p=snapPt(svgPoint(e));let d=`M ${pen.pts[0].x} ${pen.pts[0].y}`;for(let i=1;i<pen.pts.length;i++)d+=` L ${pen.pts[i].x} ${pen.pts[i].y}`;d+=` L ${p.x} ${p.y}`;pen.el.setAttribute('d',d);}
  function finishPen(close){
    if(!pen)return;
    if(pen.pts.length<2){pen.el.remove();pen=null;deselect();return;}
    rebuildPen(close);
    if(close&&state.fillOn)pen.el.setAttribute('fill',state.fill);
    const el=pen.el;pen=null;select(el);renderLayers();
    maybeReturnToSelect();
  }
  svg.addEventListener('dblclick',e=>{
    if(pen){finishPen(false);return;}
    if(state.tool==='select'){
      const t=e.target.closest('#__content > text')||(selected&&selected.tagName==='text'?selected:null);
      if(t){select(t);startTextEdit(t,false);}
    }
  });

  // ---- pencil ----
  function pencilDown(p){
    pushUndo();const el=mk('path',{d:`M ${round(p.x)} ${round(p.y)}`,fill:'none'});el.id=uid();
    el.setAttribute('stroke',state.strokeOn?state.stroke:state.fill);
    el.setAttribute('stroke-width',state.strokeOn?(state.strokeWidth||3):3);
    el.setAttribute('stroke-linecap','round');el.setAttribute('stroke-linejoin','round');el.setAttribute('opacity',state.opacity);
    gContent.appendChild(el);select(el);action={type:'pencil',pts:[p]};
  }
  function smoothPath(pts){
    if(pts.length<2)return`M ${round(pts[0].x)} ${round(pts[0].y)}`;
    let d=`M ${round(pts[0].x)} ${round(pts[0].y)}`;
    for(let i=1;i<pts.length-1;i++){const mx=(pts[i].x+pts[i+1].x)/2,my=(pts[i].y+pts[i+1].y)/2;d+=` Q ${round(pts[i].x)} ${round(pts[i].y)} ${round(mx)} ${round(my)}`;}
    const l=pts[pts.length-1];d+=` L ${round(l.x)} ${round(l.y)}`;return d;
  }

  // ---- text: in-page editing ----
  const textInput=$('textEdit');
  function placeText(p){
    pushUndo();
    const el=mk('text',{x:round(p.x),y:round(p.y)});el.id=uid();
    el.setAttribute('font-size',state.fontSize);el.setAttribute('font-family',state.fontFamily);el.setAttribute('font-weight',state.fontWeight);
    el.setAttribute('fill',state.fillOn?state.fill:'#000000');
    el.setAttribute('opacity',state.opacity);
    gContent.appendChild(el);
    select(el);renderLayers();
    startTextEdit(el,true);
  }
  function startTextEdit(el,isNew){
    if(editing)commitTextEdit();
    if(!isNew)pushUndo();
    editing={el,isNew,orig:el.textContent};
    const wr=wrap.getBoundingClientRect(),sr=svg.getBoundingClientRect();
    const x=+el.getAttribute('x'),y=+el.getAttribute('y');
    const fs=(+el.getAttribute('font-size')||40)*state.zoom;
    textInput.style.left=(sr.left-wr.left+x*state.zoom-3)+'px';
    textInput.style.top=(sr.top-wr.top+(y*state.zoom)-fs*0.95)+'px';
    textInput.style.fontSize=fs+'px';
    textInput.style.fontFamily=el.getAttribute('font-family')||'sans-serif';
    textInput.style.fontWeight=el.getAttribute('font-weight')||'400';
    const f=el.getAttribute('fill');
    textInput.style.color=(f&&f!=='none')?f:'#000';
    textInput.value=el.textContent;
    textInput.style.display='block';
    el.style.visibility='hidden';
    textInput.focus();
    textInput.select();
    setTimeout(()=>{if(editing&&document.activeElement!==textInput){textInput.focus();textInput.select();}},0);
  }
  textInput.addEventListener('input',()=>{if(editing)editing.el.textContent=textInput.value;});
  textInput.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Enter'){e.preventDefault();commitTextEdit();}
    if(e.key==='Escape'){e.preventDefault();cancelTextEdit();}
  });
  textInput.addEventListener('blur',()=>{if(editing)commitTextEdit();});
  function closeTextInput(){textInput.style.display='none';textInput.value='';textInput.blur();}
  function commitTextEdit(){
    if(!editing)return;
    const{el,isNew}=editing;editing=null;
    el.style.visibility='';
    el.textContent=textInput.value;
    closeTextInput();
    if(!el.textContent.trim()){el.remove();deselect();renderLayers();if(isNew)maybeReturnToSelect();return;}
    if(isNew)maybeReturnToSelect();
    select(el);renderLayers();updateOverlay();
  }
  function cancelTextEdit(){
    if(!editing)return;
    const{el,isNew,orig}=editing;editing=null;
    el.style.visibility='';
    closeTextInput();
    if(isNew){el.remove();deselect();renderLayers();setTool('select');return;}
    el.textContent=orig;
    select(el);renderLayers();
  }
  $('editTextBtn').onclick=()=>{if(selected&&selected.tagName==='text')startTextEdit(selected,false);};

  // ---- context ----
  const toolNames={rect:'Rechteck',ellipse:'Kreis',line:'Linie',polygon:'Stern',pen:'Kurve',pencil:'Stift',text:'Text'};
  function showSecs(ids){
    document.querySelectorAll('.panel-scroll .sec').forEach(s=>s.classList.toggle('on',ids.includes(s.id)));
  }
  function showOpts(ids){
    document.querySelectorAll('.optbar .opt-group').forEach(g=>g.classList.toggle('on',ids.includes(g.id)));
  }
  function updateContext(){
    const head=$('ctxHead'),label=$('ctxLabel'),chip=$('ctxChip'),chipLabel=$('ctxChipLabel');
    if(selected){
      head.className='ctx-head ctx-object';chip.className='ctx-chip object';
      label.textContent=chipLabel.textContent=layerName(selected);
      const t=selected.tagName;
      const ids=['secOpacity','secArrange','secActions'];
      if(t==='rect')ids.push('secCorner');
      if(t==='polygon'){
        ids.push('secPoly');
        const star=!!selected.dataset.star;
        const n=(extractPoints(selected)||[]).length;
        const sides=star?n/2:n;
        if(sides>=3){state.polySides=sides;$('polySides').value=sides;$('polySidesVal').textContent=sides;}
        state.polyStar=star;$('polyStar').checked=star;
      }
      if(t==='text')ids.push('secText');
      showSecs(ids);
      showOpts(['gFill','gStroke','gObj']);
      $('editTextBtn').style.display=(t==='text')?'flex':'none';
      syncStyleFromSelection();
      syncObjFields();
    }else if(state.tool==='select'||state.tool==='node'){
      head.className='ctx-head ctx-page';chip.className='ctx-chip page';
      label.textContent=chipLabel.textContent='Seite';
      showSecs(['secPageClear']);
      showOpts(['gPage']);
    }else{
      head.className='ctx-head ctx-tool';chip.className='ctx-chip tool';
      label.textContent=chipLabel.textContent='Neu: '+(toolNames[state.tool]||state.tool);
      const ids=['secOpacity','secDraw'];
      if(state.tool==='rect')ids.push('secCorner');
      if(state.tool==='polygon'){ids.push('secPoly');$('polyStar').checked=state.polyStar;$('polySides').value=state.polySides;$('polySidesVal').textContent=state.polySides;}
      if(state.tool==='text')ids.push('secText');
      showSecs(ids);
      showOpts(['gFill','gStroke']);
      $('keepDrawing').checked=!!state.keep[state.tool];
      $('editTextBtn').style.display='none';
      syncStyleControls();
    }
  }
  $('ctxClose').onclick=()=>deselect();
  $('ctxClose2').onclick=()=>deselect();
  $('keepDrawing').onchange=e=>{if(DRAW_TOOLS.includes(state.tool))state.keep[state.tool]=e.target.checked;};
  function maybeReturnToSelect(){if(DRAW_TOOLS.includes(state.tool)&&!state.keep[state.tool])setTool('select');}

  function syncStyleFromSelection(){
    const el=selected;if(!el)return;
    const fill=el.getAttribute('fill');
    if(fill&&fill!=='none'){state.fillOn=true;if(fill[0]==='#')state.fill=fill;}else state.fillOn=false;
    const stroke=el.getAttribute('stroke');
    if(stroke&&stroke!=='none'){state.strokeOn=true;if(stroke[0]==='#')state.stroke=stroke;state.strokeWidth=+el.getAttribute('stroke-width')||0;}else state.strokeOn=false;
    state.opacity=el.getAttribute('opacity')!==null?+el.getAttribute('opacity'):1;
    if(el.tagName==='rect')state.corner=+el.getAttribute('rx')||0;
    if(el.tagName==='text'){state.fontSize=+el.getAttribute('font-size')||40;$('fontSize').value=Math.min(300,state.fontSize);$('fontSizeVal').textContent=Math.round(state.fontSize);}
    syncStyleControls();
  }
  function syncStyleControls(){
    const fs=$('fillSw'),ss=$('strokeSw'),bs=$('bgSw');
    fs.classList.toggle('none',!state.fillOn);
    fs.style.background=state.fillOn?state.fill:'';
    ss.classList.toggle('none',!state.strokeOn);
    ss.style.background=state.strokeOn?state.stroke:'';
    bs.classList.toggle('none',!state.bgOn);
    bs.style.background=state.bgOn?state.bg:'';
    $('strokeWidth').value=state.strokeWidth;
    $('opacity').value=Math.round(state.opacity*100);$('opacityVal').textContent=Math.round(state.opacity*100);
    $('cornerRadius').value=state.corner;$('cornerRadiusVal').textContent=state.corner;
  }
  function syncObjFields(){
    if(!selected)return;
    const b=bbox(selected);
    const set=(id,v)=>{const i=$(id);if(document.activeElement!==i)i.value=v;};
    set('objX',fmt(b.x));set('objY',fmt(b.y));
    set('objW',fmt(b.width));set('objH',fmt(b.height));
    set('objRot',fmt(getRot(selected)));
  }

  // ---- color popover (one clean menu for fill / stroke / background) ----
  const colorPop=$('colorPop');
  let popTarget=null;
  const PALETTE=[
    '#ffffff','#c9ccd1','#7f8899','#3b3f47','#000000','#8e5b3a','#d9a066',
    '#e02020','#ff6900','#ffc600','#7ed321','#00b8a9','#0f9bf2','#2653f1',
    '#7b40bf','#c433c9','#ff5e9d','#ffd3e0','#a8e6cf','#cfe8ff','#4a9eff',
  ];
  PALETTE.forEach(c=>{
    const b=document.createElement('button');b.style.background=c;b.title=c;
    b.onclick=()=>{applyPopColor(c);closePop();};
    $('cpSwatches').appendChild(b);
  });
  function openPop(target,anchor){
    popTarget=target;
    const r=anchor.getBoundingClientRect();
    colorPop.style.left=Math.min(window.innerWidth-236,r.left)+'px';
    colorPop.style.top=(r.bottom+6)+'px';
    colorPop.classList.add('open');
    const cur=target==='fill'?state.fill:target==='stroke'?state.stroke:state.bg;
    if(/^#[0-9a-f]{6}$/i.test(cur))$('cpCustom').value=cur;
  }
  function closePop(){colorPop.classList.remove('open');popTarget=null;}
  function applyPopColor(c){
    if(popTarget==='fill'){state.fill=c;state.fillOn=true;styleChanged('fill');}
    else if(popTarget==='stroke'){state.stroke=c;state.strokeOn=true;if(state.strokeWidth<1)state.strokeWidth=3;styleChanged('stroke');}
    else if(popTarget==='bg'){state.bg=c;state.bgOn=true;updateBg();}
    syncStyleControls();
  }
  function applyPopNone(){
    if(popTarget==='fill'){state.fillOn=false;styleChanged('fill-none');}
    else if(popTarget==='stroke'){state.strokeOn=false;styleChanged('stroke-none');}
    else if(popTarget==='bg'){state.bgOn=false;updateBg();}
    syncStyleControls();
  }
  $('cpNone').onclick=()=>{applyPopNone();closePop();};
  $('cpCustom').oninput=e=>applyPopColor(e.target.value);
  $('fillBtn').onclick=e=>{e.stopPropagation();colorPop.classList.contains('open')&&popTarget==='fill'?closePop():openPop('fill',e.currentTarget);};
  $('strokeBtn').onclick=e=>{e.stopPropagation();colorPop.classList.contains('open')&&popTarget==='stroke'?closePop():openPop('stroke',e.currentTarget);};
  $('bgBtn').onclick=e=>{e.stopPropagation();colorPop.classList.contains('open')&&popTarget==='bg'?closePop():openPop('bg',e.currentTarget);};
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('#colorPop,#fillBtn,#strokeBtn,#bgBtn'))closePop();});

  // ---- layers ----
  function layerName(el){
    const m={rect:'Rechteck',ellipse:'Kreis',circle:'Kreis',line:'Linie',polygon:(el.dataset&&el.dataset.star)?'Stern':'Vieleck',polyline:'Linienzug',path:'Kurve',text:'Text: '+(el.textContent||'').slice(0,12),image:'Bild'};
    return m[el.tagName]||el.tagName;
  }
  function renderLayers(){
    const list=$('layersList'),els=[...gContent.children].reverse();
    if(!els.length){list.innerHTML='<div class="empty">Keine Objekte</div>';return;}
    list.innerHTML='';
    els.forEach(el=>{
      const item=document.createElement('div');item.className='layer-item'+(el===selected?' sel':'');
      const sw=document.createElement('div');sw.className='lswatch';
      const f=el.getAttribute('fill');sw.style.background=(f&&f!=='none')?f:(el.getAttribute('stroke')||'#888');
      const name=document.createElement('div');name.className='lname';name.textContent=layerName(el);
      const hidden=el.style.display==='none';
      const hb=document.createElement('button');hb.className='lbtn';hb.title='Ein-/Ausblenden';
      hb.innerHTML=hidden?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><line x1="3" y1="3" x2="21" y2="21"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
      hb.onclick=ev=>{ev.stopPropagation();el.style.display=hidden?'':'none';renderLayers();};
      item.appendChild(sw);item.appendChild(name);item.appendChild(hb);
      item.onclick=()=>select(el);
      list.appendChild(item);
    });
  }

  // ---- object ops ----
  function duplicate(){if(!selected)return;pushUndo();const c=selected.cloneNode(true);c.id=uid();applyGeom(c,captureGeom(selected),15,15);gContent.appendChild(c);select(c);renderLayers();}
  function del(){if(!selected)return;pushUndo();selected.remove();deselect();renderLayers();}
  function toFront(){if(!selected)return;pushUndo();gContent.appendChild(selected);renderLayers();}
  function toBack(){if(!selected)return;pushUndo();gContent.insertBefore(selected,gContent.firstChild);renderLayers();}
  function forward(){if(!selected||!selected.nextElementSibling)return;pushUndo();gContent.insertBefore(selected.nextElementSibling,selected);renderLayers();}
  function backward(){if(!selected||!selected.previousElementSibling)return;pushUndo();gContent.insertBefore(selected,selected.previousElementSibling);renderLayers();}
  function flip(horiz){
    if(!selected)return;pushUndo();
    const b=bbox(selected),cx=b.x+b.width/2,cy=b.y+b.height/2;
    const fx=horiz?x=>2*cx-x:x=>x,fy=horiz?y=>y:y=>2*cy-y;
    scaleLike(selected,fx,fy);updateOverlay();syncObjFields();
  }
  function scaleLike(el,fx,fy){
    const t=el.tagName;
    if(t==='rect'){const x=+el.getAttribute('x'),w=+el.getAttribute('width'),y=+el.getAttribute('y'),h=+el.getAttribute('height');el.setAttribute('x',round(Math.min(fx(x),fx(x+w))));el.setAttribute('y',round(Math.min(fy(y),fy(y+h))));}
    else if(t==='ellipse'||t==='circle'){el.setAttribute('cx',round(fx(+el.getAttribute('cx'))));el.setAttribute('cy',round(fy(+el.getAttribute('cy'))));}
    else if(t==='line'){el.setAttribute('x1',round(fx(+el.getAttribute('x1'))));el.setAttribute('x2',round(fx(+el.getAttribute('x2'))));el.setAttribute('y1',round(fy(+el.getAttribute('y1'))));el.setAttribute('y2',round(fy(+el.getAttribute('y2'))));}
    else if(t==='text')el.setAttribute('x',round(fx(+el.getAttribute('x'))));
    else if(t==='polygon'||t==='polyline')el.setAttribute('points',el.getAttribute('points').trim().split(/\s+/).map(pr=>{const[a,c]=pr.split(',').map(Number);return`${round(fx(a))},${round(fy(c))}`;}).join(' '));
    else if(t==='path')el.setAttribute('d',scalePath(el.getAttribute('d'),fx,fy));
  }

  // ---- tools ----
  function setTool(t){
    if(editing)commitTextEdit();
    if(pen&&t!=='pen')finishPen(false);
    state.tool=t;
    if(['line','pen','pencil'].includes(t)&&(!state.strokeOn||state.strokeWidth<1)){
      state.strokeOn=true;
      if(state.strokeWidth<1)state.strokeWidth=3;
    }
    document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
    $('insertBtn').classList.toggle('active',DRAW_TOOLS.includes(t));
    svg.style.cursor=(t==='select')?'default':(t==='text')?'text':'crosshair';
    if(t!=='select'&&t!=='node'){selected=null;renderLayers();}
    updateOverlay();
    updateContext();
  }
  $('toolbar').addEventListener('click',e=>{const b=e.target.closest('.tool');if(b&&b.dataset.tool)setTool(b.dataset.tool);});
  const flyout=$('flyout');
  $('insertBtn').addEventListener('click',()=>flyout.classList.toggle('open'));
  flyout.addEventListener('click',e=>{const b=e.target.closest('button');if(b){setTool(b.dataset.tool);flyout.classList.remove('open');}});
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('#flyout,#insertBtn'))flyout.classList.remove('open');});

  // ---- zoom & pan (no scrollbars, Scratch-like) ----
  let panX=0,panY=0,panDrag=null;
  function applyPan(){stage.style.transform=`translate(${panX}px,${panY}px)`;}
  function setZoom(z){
    state.zoom=Math.round(Math.max(0.02,Math.min(100,z))*10000)/10000;
    $('zoomVal').textContent=Math.max(1,Math.round(state.zoom*100))+'%';
    applyCanvasSize();
  }
  function fitZoom(){
    const pad=110;
    panX=0;panY=0;applyPan();
    setZoom(Math.min((view.clientWidth-pad)/state.w,(view.clientHeight-pad)/state.h,4));
  }
  $('zoomIn').onclick=()=>setZoom(state.zoom*1.2);
  $('zoomOut').onclick=()=>setZoom(state.zoom/1.2);
  $('zoomFit').onclick=fitZoom;
  view.addEventListener('wheel',e=>{
    e.preventDefault();
    if(e.ctrlKey||e.metaKey){setZoom(state.zoom*(e.deltaY<0?1.1:0.9));}
    else{panX-=e.deltaX;panY-=e.deltaY;applyPan();}
  },{passive:false});
  view.addEventListener('pointerdown',e=>{
    if(e.button===1){
      e.preventDefault();
      panDrag={sx:e.clientX,sy:e.clientY,ox:panX,oy:panY};
      view.setPointerCapture(e.pointerId);
    }
  });
  view.addEventListener('pointermove',e=>{
    if(panDrag){panX=panDrag.ox+e.clientX-panDrag.sx;panY=panDrag.oy+e.clientY-panDrag.sy;applyPan();}
  });
  view.addEventListener('pointerup',()=>{panDrag=null;});

  // ---- top bar: grid & snap (page-wide, affects all actions) ----
  $('gridBtn').onclick=()=>{state.grid=!state.grid;$('gridBtn').classList.toggle('on',state.grid);drawGrid();};
  const SNAP_ORDER=['off','grid','pixel'],SNAP_LABEL={off:'Aus',grid:'Raster',pixel:'Pixel'};
  $('snapBtn').onclick=()=>{
    const i=(SNAP_ORDER.indexOf(state.snapMode)+1)%3;
    state.snapMode=SNAP_ORDER[i];
    $('snapLabel').textContent=SNAP_LABEL[state.snapMode];
    $('snapBtn').classList.toggle('on',state.snapMode!=='off');
  };

  // ---- option bar controls ----
  $('strokeWidth').onchange=e=>{
    let v=Math.max(0,+e.target.value||0);
    state.strokeWidth=v;
    if(v>0)state.strokeOn=true;
    if(v===0&&selected&&selected.tagName!=='line')state.strokeOn=false;
    styleChanged('stroke-w');syncStyleControls();
  };
  $('opacity').oninput=e=>{state.opacity=+e.target.value/100;$('opacityVal').textContent=e.target.value;styleChanged('opacity');};
  $('cornerRadius').oninput=e=>{state.corner=+e.target.value;$('cornerRadiusVal').textContent=e.target.value;styleChanged('corner');};
  $('polySides').oninput=e=>{state.polySides=+e.target.value;$('polySidesVal').textContent=e.target.value;regenPoly();};
  $('polyStar').onchange=e=>{state.polyStar=e.target.checked;regenPoly();};
  function regenPoly(){
    if(selected&&selected.tagName==='polygon'){
      pushUndo('poly');
      const b=bbox(selected),cx=b.x+b.width/2,cy=b.y+b.height/2,r=Math.max(b.width,b.height)/2;
      selected.setAttribute('points',polyPoints(cx,cy,r,state.polySides,0,state.polyStar));
      if(state.polyStar)selected.dataset.star='1';else delete selected.dataset.star;
      updateOverlay();renderLayers();
    }
  }
  $('fontSize').oninput=e=>{state.fontSize=+e.target.value;$('fontSizeVal').textContent=e.target.value;if(selected&&selected.tagName==='text'){pushUndo('font-size');selected.setAttribute('font-size',state.fontSize);updateOverlay();syncObjFields();}};
  $('fontFamily').onchange=e=>{state.fontFamily=e.target.value;if(selected&&selected.tagName==='text'){pushUndo();selected.setAttribute('font-family',state.fontFamily);updateOverlay();}};
  $('fontWeight').onchange=e=>{state.fontWeight=e.target.value;if(selected&&selected.tagName==='text'){pushUndo();selected.setAttribute('font-weight',state.fontWeight);updateOverlay();}};

  function setPos(x,y){if(!selected)return;const b=bbox(selected);applyGeom(selected,captureGeom(selected),x-b.x,y-b.y);updateOverlay();}
  function setSize(w,h){
    if(!selected)return;
    const b=copyBox(selected);
    if(selected.tagName==='polygon'||selected.tagName==='polyline')b.points=selected.getAttribute('points');
    if(selected.tagName==='path')b.d=selected.getAttribute('d');
    if(selected.tagName==='text')b.fontSize=+selected.getAttribute('font-size')||40;
    if(selected.tagName==='line')b.line={x1:+selected.getAttribute('x1'),y1:+selected.getAttribute('y1'),x2:+selected.getAttribute('x2'),y2:+selected.getAttribute('y2')};
    scaleTo(selected,b,b.x,b.y,Math.max(1,w),Math.max(1,h));
    updateOverlay();
  }
  $('objX').onchange=e=>{if(!selected)return;pushUndo();setPos(+e.target.value||0,bbox(selected).y);syncObjFields();};
  $('objY').onchange=e=>{if(!selected)return;pushUndo();setPos(bbox(selected).x,+e.target.value||0);syncObjFields();};
  $('objW').onchange=e=>{if(!selected)return;pushUndo();setSize(+e.target.value||1,bbox(selected).height);syncObjFields();};
  $('objH').onchange=e=>{if(!selected)return;pushUndo();setSize(bbox(selected).width,+e.target.value||1);syncObjFields();};
  $('objRot').onchange=e=>{if(!selected)return;pushUndo();const b=bbox(selected);setRot(selected,+e.target.value||0,b.x+b.width/2,b.y+b.height/2);updateOverlay();syncObjFields();};
  $('dupBtn').onclick=duplicate;$('delBtn').onclick=del;
  $('frontBtn').onclick=toFront;$('backBtn').onclick=toBack;$('fwdBtn').onclick=forward;$('bwdBtn').onclick=backward;
  $('flipHBtn').onclick=()=>flip(true);$('flipVBtn').onclick=()=>flip(false);
  $('undoBtn').onclick=undo;$('redoBtn').onclick=redo;

  $('canvasW').onchange=e=>{state.w=Math.max(1,+e.target.value||1);applyCanvasSize();};
  $('canvasH').onchange=e=>{state.h=Math.max(1,+e.target.value||1);applyCanvasSize();};

  let clearArmed=false,clearTimer=null;
  $('clearBtn').onclick=()=>{
    if(!clearArmed){
      clearArmed=true;$('clearBtn').textContent='Wirklich löschen?';
      clearTimer=setTimeout(()=>{clearArmed=false;$('clearBtn').textContent='Alles löschen';},2500);
      return;
    }
    clearTimeout(clearTimer);clearArmed=false;$('clearBtn').textContent='Alles löschen';
    pushUndo();gContent.innerHTML='';deselect();renderLayers();
  };

  // ---- keyboard ----
  window.addEventListener('keydown',e=>{
    if(e.target.matches('input,select,textarea'))return;
    const k=e.key.toLowerCase();
    if(e.ctrlKey||e.metaKey){
      if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
      if(k==='y'){e.preventDefault();redo();return;}
      if(k==='d'){e.preventDefault();duplicate();return;}
      return;
    }
    const tools={v:'select',a:'node',r:'rect',o:'ellipse',l:'line',p:'polygon',b:'pen',f:'pencil',t:'text'};
    if(tools[k]){setTool(tools[k]);return;}
    if(k==='delete'||k==='backspace'){e.preventDefault();del();return;}
    if(k==='escape'){if(pen){pen.el.remove();pen=null;deselect();}else deselect();return;}
    if(k==='enter'){if(pen)finishPen(false);return;}
    if(selected&&['arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
      e.preventDefault();const s=e.shiftKey?10:1;let dx=0,dy=0;
      if(k==='arrowup')dy=-s;if(k==='arrowdown')dy=s;if(k==='arrowleft')dx=-s;if(k==='arrowright')dx=s;
      pushUndo('nudge');applyGeom(selected,captureGeom(selected),dx,dy);updateOverlay();syncObjFields();
    }
  });

  // ---- export / import ----
  function serialize(){
    const out=mk('svg',{xmlns:SVGNS,width:state.w,height:state.h,viewBox:`0 0 ${state.w} ${state.h}`});
    if(state.bgOn)out.appendChild(mk('rect',{x:0,y:0,width:state.w,height:state.h,fill:state.bg}));
    [...gContent.children].forEach(n=>{if(n.style.display==='none')return;const c=n.cloneNode(true);c.removeAttribute('data-rot');c.removeAttribute('data-star');c.style.visibility='';if(!c.getAttribute('style'))c.removeAttribute('style');out.appendChild(c);});
    return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(out);
  }
  function download(name,data,type){const b=new Blob([data],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
  $('exportSvgBtn').onclick=()=>{commitTextEdit();deselect();download('zeichnung.svg',serialize(),'image/svg+xml');};
  $('exportPngBtn').onclick=()=>{
    commitTextEdit();deselect();
    const data=serialize(),img=new Image(),scale=2,blob=new Blob([data],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob);
    img.onload=()=>{const c=document.createElement('canvas');c.width=state.w*scale;c.height=state.h*scale;const ctx=c.getContext('2d');ctx.scale(scale,scale);ctx.drawImage(img,0,0);c.toBlob(b=>{download('zeichnung.png',b,'image/png');URL.revokeObjectURL(url);});};
    img.onerror=()=>{URL.revokeObjectURL(url);toast('PNG-Export fehlgeschlagen');};
    img.src=url;
  };
  $('importBtn').onclick=()=>$('fileInput').click();
  $('fileInput').onchange=e=>{
    const file=e.target.files[0];if(!file)return;const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const doc=new DOMParser().parseFromString(ev.target.result,'image/svg+xml'),root=doc.querySelector('svg');
        if(!root)throw new Error('Kein SVG');
        pushUndo();
        const vb=root.getAttribute('viewBox');
        if(vb){const[,,w,h]=vb.split(/[\s,]+/).map(Number);if(w&&h){state.w=Math.round(w);state.h=Math.round(h);}}
        else{const w=parseFloat(root.getAttribute('width')),h=parseFloat(root.getAttribute('height'));if(w&&h){state.w=Math.round(w);state.h=Math.round(h);}}
        $('canvasW').value=state.w;$('canvasH').value=state.h;
        gContent.innerHTML='';
        [...root.childNodes].forEach(n=>{if(n.nodeType===1&&!['title','desc','defs','metadata'].includes(n.tagName)){const imp=document.importNode(n,true);if(!imp.id)imp.id=uid();gContent.appendChild(imp);}});
        deselect();applyCanvasSize();fitZoom();renderLayers();
      }catch(err){toast('Konnte SVG nicht laden');}
    };
    reader.readAsText(file);e.target.value='';
  };

  // ---- init ----
  applyCanvasSize();syncStyleControls();updateUndoButtons();renderLayers();
  setTool('select');
  setTimeout(fitZoom,50);
})();
</script>
</body>
</html>
