<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple SVG Editor</title>
<style>
  :root{
    --bg:#f3f0fb;
    --panel:#ffffff;
    --ink:#1e1140;
    --muted:#7a6ea3;
    --line:#e6e0f5;
    --brand:#7b5cff;
    --brand-2:#ff6ba6;
    --accent:#22c1a6;
    --warn:#ff8a3d;
    --shadow:0 6px 18px rgba(70,40,140,.12);
    --radius:16px;
    --radius-sm:11px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  /* ---------- Layout ---------- */
  .app{
    display:grid;
    grid-template-rows:auto 1fr;
    height:100vh;
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 16px;
    background:linear-gradient(100deg,var(--brand),var(--brand-2));
    color:#fff;
    box-shadow:0 4px 14px rgba(90,50,170,.25);
    z-index:20;
    flex-wrap:wrap;
  }
  .logo{
    display:flex;align-items:center;gap:10px;
    font-weight:900;font-size:20px;letter-spacing:.3px;
  }
  .logo .dot{
    width:26px;height:26px;border-radius:9px;
    background:#fff;display:grid;place-items:center;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.4);
  }
  .logo .dot svg{width:16px;height:16px;}
  .topbar .spacer{flex:1;}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-weight:800;
    border-radius:12px;padding:9px 14px;font-size:14px;
    display:inline-flex;align-items:center;gap:7px;
    transition:transform .08s ease, box-shadow .12s ease, background .12s;
  }
  .btn:active{transform:translateY(1px) scale(.98);}
  .btn.ghost{background:rgba(255,255,255,.16);color:#fff;}
  .btn.ghost:hover{background:rgba(255,255,255,.28);}
  .btn.light{background:#fff;color:var(--brand);box-shadow:var(--shadow);}
  .btn.light:hover{background:#f3eeff;}
  .btn svg{width:16px;height:16px;}

  .workspace{
    display:grid;
    grid-template-columns:76px 1fr 268px;
    min-height:0;
  }
  @media(max-width:860px){
    .workspace{grid-template-columns:64px 1fr;}
    .rightpanel{display:none;}
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:12px 10px;
    display:flex;flex-direction:column;gap:8px;
    align-items:center;
    overflow-y:auto;
  }
  .tool{
    width:54px;height:54px;border-radius:var(--radius-sm);
    border:2px solid transparent;
    background:#f5f2ff;color:var(--ink);
    cursor:pointer;display:grid;place-items:center;
    transition:transform .08s, background .12s, border-color .12s, box-shadow .12s;
    position:relative;
  }
  .tool:hover{background:#ece6ff;}
  .tool svg{width:24px;height:24px;pointer-events:none;}
  .tool.active{
    background:var(--brand);color:#fff;border-color:#fff;
    box-shadow:0 4px 12px rgba(123,92,255,.45);
    transform:translateY(-1px);
  }
  .tool .kbd{
    position:absolute;bottom:2px;right:4px;font-size:9px;font-weight:800;
    opacity:.55;
  }
  .tool.active .kbd{opacity:.85;}
  .tool-sep{height:1px;width:70%;background:var(--line);margin:4px 0;}
  .tool-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

  /* ---------- Canvas ---------- */
  .canvas-wrap{
    position:relative;
    background:
      radial-gradient(circle at 20% 15%, #efe9ff 0, transparent 40%),
      radial-gradient(circle at 85% 80%, #ffe9f3 0, transparent 45%),
      #f7f5ff;
    overflow:hidden;
    min-height:0;
  }
  .canvas-scroll{
    position:absolute;inset:0;
    overflow:auto;
    display:grid;place-items:center;
  }
  .stage-pad{padding:60px;}
  svg#canvas{
    background:#fff;
    box-shadow:0 10px 40px rgba(60,30,120,.18);
    border-radius:6px;
    display:block;
    touch-action:none;
  }
  .handle{cursor:pointer;}
  .selbox{fill:none;stroke:var(--brand);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;}
  .h-corner{fill:#fff;stroke:var(--brand);stroke-width:2;vector-effect:non-scaling-stroke;}
  .h-rot{fill:var(--accent);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;}
  .h-node{fill:#fff;stroke:var(--brand-2);stroke-width:2;vector-effect:non-scaling-stroke;cursor:move;}
  .h-line{stroke:var(--brand);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.6;}

  .zoombar{
    position:absolute;left:14px;bottom:14px;
    background:var(--panel);border-radius:14px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:2px;padding:5px;
    z-index:10;
  }
  .zoombar button{
    width:34px;height:34px;border:none;background:transparent;border-radius:9px;
    cursor:pointer;font-size:18px;font-weight:900;color:var(--brand);
    display:grid;place-items:center;
  }
  .zoombar button:hover{background:#f1ecff;}
  .zoombar .zval{font-weight:800;font-size:13px;min-width:48px;text-align:center;color:var(--muted);}

  .hint{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    background:rgba(30,17,64,.85);color:#fff;padding:7px 16px;border-radius:20px;
    font-size:13px;font-weight:700;z-index:10;pointer-events:none;
    opacity:0;transition:opacity .3s;white-space:nowrap;
  }
  .hint.show{opacity:1;}

  /* ---------- Right panel ---------- */
  .rightpanel{
    background:var(--panel);
    border-left:1px solid var(--line);
    display:flex;flex-direction:column;
    min-height:0;
  }
  .panel-scroll{overflow-y:auto;padding:14px;flex:1;}
  .section{margin-bottom:18px;}
  .section h3{
    margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;
    color:var(--muted);font-weight:900;display:flex;align-items:center;gap:6px;
  }
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .row label{font-size:13px;font-weight:700;color:var(--ink);flex:1;}
  .swatch-wrap{display:flex;align-items:center;gap:8px;}
  input[type=color]{
    width:38px;height:32px;border:2px solid var(--line);border-radius:9px;
    padding:0;background:none;cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px;}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:6px;}
  .none-btn{
    width:32px;height:32px;border-radius:9px;border:2px solid var(--line);
    background:linear-gradient(45deg,transparent 45%,#ff5b7f 45%,#ff5b7f 55%,transparent 55%),#fff;
    cursor:pointer;
  }
  .none-btn.on{border-color:var(--brand);}
  input[type=range]{
    -webkit-appearance:none;appearance:none;height:6px;border-radius:6px;
    background:var(--line);flex:2;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--brand);cursor:pointer;box-shadow:0 2px 5px rgba(123,92,255,.5);
  }
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border:none;border-radius:50%;background:var(--brand);cursor:pointer;
  }
  .valnum{font-size:12px;font-weight:800;color:var(--muted);min-width:34px;text-align:right;}
  .txtinput,select{
    width:100%;border:2px solid var(--line);border-radius:9px;padding:8px 10px;
    font-family:inherit;font-weight:700;font-size:13px;color:var(--ink);
    background:#faf9ff;
  }
  .txtinput:focus,select:focus{outline:none;border-color:var(--brand);}

  .palette{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:4px;}
  .palette button{
    width:100%;aspect-ratio:1;border-radius:7px;border:2px solid rgba(0,0,0,.06);cursor:pointer;
    transition:transform .08s;
  }
  .palette button:hover{transform:scale(1.15);}

  /* Layers */
  .layers{display:flex;flex-direction:column;gap:5px;}
  .layer-item{
    display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;
    background:#faf9ff;border:2px solid transparent;cursor:pointer;font-size:13px;font-weight:700;
  }
  .layer-item:hover{background:#f1ecff;}
  .layer-item.sel{border-color:var(--brand);background:#efe9ff;}
  .layer-item .lswatch{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.15);flex:none;}
  .layer-item .lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .layer-item .lbtn{border:none;background:none;cursor:pointer;color:var(--muted);padding:2px;border-radius:5px;display:grid;place-items:center;}
  .layer-item .lbtn:hover{background:rgba(0,0,0,.08);color:var(--ink);}
  .layer-item .lbtn svg{width:15px;height:15px;}
  .empty{color:var(--muted);font-size:13px;font-weight:700;text-align:center;padding:16px 0;}

  .zbtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .zbtns .btn{justify-content:center;background:#f5f2ff;color:var(--ink);width:100%;}
  .zbtns .btn:hover{background:#ece6ff;}
  .danger{background:#ffeef2 !important;color:#e23d6d !important;}
  .danger:hover{background:#ffe0e8 !important;}

  .canvas-size{display:flex;gap:8px;align-items:center;}
  .canvas-size input{width:100%;}
  .mini{font-size:11px;color:var(--muted);font-weight:700;margin-top:-4px;}

  input[type=file]{display:none;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer;}
  .checkbox-row input{width:17px;height:17px;accent-color:var(--brand);cursor:pointer;}

  /* Scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#d8cef2;border-radius:8px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:#c3b4ec;background-clip:content-box;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">
      <span class="dot">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20L14 4l6 10-3 6H4z" fill="#7b5cff"/><circle cx="8" cy="17" r="2" fill="#ff6ba6"/></svg>
      </span>
      Simple SVG
    </div>
    <div class="spacer"></div>
    <div class="top-actions">
      <button class="btn ghost" id="undoBtn" title="Rückgängig (Strg+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
      </button>
      <button class="btn ghost" id="redoBtn" title="Wiederholen (Strg+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg>
      </button>
      <button class="btn light" id="importBtn">📂 SVG öffnen</button>
      <button class="btn light" id="exportSvgBtn">💾 SVG</button>
      <button class="btn light" id="exportPngBtn">🖼️ PNG</button>
      <input type="file" id="fileInput" accept=".svg,image/svg+xml">
    </div>
  </header>

  <div class="workspace">
    <!-- Toolbar -->
    <nav class="toolbar" id="toolbar">
      <button class="tool active" data-tool="select" title="Auswählen & Bewegen (V)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l15 8-6.5 1.8L11 20 5 3z"/></svg>
        <span class="kbd">V</span>
      </button>
      <button class="tool" data-tool="node" title="Punkte bearbeiten (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20L20 4" /><rect x="2" y="18" width="4" height="4" rx="1" fill="currentColor"/><rect x="18" y="2" width="4" height="4" rx="1" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg>
        <span class="kbd">A</span>
      </button>
      <div class="tool-sep"></div>
      <button class="tool" data-tool="rect" title="Rechteck (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="6" width="16" height="12" rx="2"/></svg>
        <span class="kbd">R</span>
      </button>
      <button class="tool" data-tool="ellipse" title="Ellipse (O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>
        <span class="kbd">O</span>
      </button>
      <button class="tool" data-tool="line" title="Linie (L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.6" fill="currentColor"/><circle cx="19" cy="5" r="1.6" fill="currentColor"/></svg>
        <span class="kbd">L</span>
      </button>
      <button class="tool" data-tool="polygon" title="Vieleck / Stern (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.1 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.3l6.1-.7z"/></svg>
        <span class="kbd">P</span>
      </button>
      <button class="tool" data-tool="pen" title="Pfad zeichnen / Pen (B)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c6-14 10-14 16 0"/><circle cx="4" cy="20" r="1.8" fill="currentColor"/><circle cx="20" cy="20" r="1.8" fill="currentColor"/><circle cx="12" cy="8" r="1.8" fill="currentColor"/></svg>
        <span class="kbd">B</span>
      </button>
      <button class="tool" data-tool="pencil" title="Freihand (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3-1 4-3 4-3l10-10-3-3L4 12s-2 1-3 4l2 5z"/><path d="M14 5l3 3"/></svg>
        <span class="kbd">F</span>
      </button>
      <button class="tool" data-tool="text" title="Text (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
        <span class="kbd">T</span>
      </button>
    </nav>

    <!-- Canvas -->
    <div class="canvas-wrap">
      <div class="canvas-scroll" id="canvasScroll">
        <div class="stage-pad">
          <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
      <div class="hint" id="hint"></div>
      <div class="zoombar">
        <button id="zoomOut" title="Verkleinern">−</button>
        <span class="zval" id="zoomVal">100%</span>
        <button id="zoomIn" title="Vergrößern">+</button>
        <button id="zoomFit" title="Einpassen" style="font-size:14px;">⤢</button>
      </div>
    </div>

    <!-- Right panel -->
    <aside class="rightpanel">
      <div class="panel-scroll">
        <div class="section">
          <h3>🎨 Aussehen</h3>
          <div class="row">
            <label>Füllung</label>
            <div class="swatch-wrap">
              <button class="none-btn" id="fillNone" title="Keine Füllung"></button>
              <input type="color" id="fillColor" value="#7b5cff">
            </div>
          </div>
          <div class="palette" id="fillPalette"></div>
          <div class="row" style="margin-top:12px;">
            <label>Kontur</label>
            <div class="swatch-wrap">
              <button class="none-btn on" id="strokeNone" title="Keine Kontur"></button>
              <input type="color" id="strokeColor" value="#1e1140">
            </div>
          </div>
          <div class="row">
            <label>Breite</label>
            <input type="range" id="strokeWidth" min="0" max="40" step="0.5" value="0">
            <span class="valnum" id="strokeWidthVal">0</span>
          </div>
          <div class="row">
            <label>Deckkraft</label>
            <input type="range" id="opacity" min="0" max="100" step="1" value="100">
            <span class="valnum" id="opacityVal">100</span>
          </div>
          <div class="row" id="cornerRow">
            <label>Ecken-Radius</label>
            <input type="range" id="cornerRadius" min="0" max="120" step="1" value="0">
            <span class="valnum" id="cornerRadiusVal">0</span>
          </div>
        </div>

        <div class="section" id="polyOptions" style="display:none;">
          <h3>⭐ Vieleck</h3>
          <div class="row">
            <label>Ecken</label>
            <input type="range" id="polySides" min="3" max="12" step="1" value="5">
            <span class="valnum" id="polySidesVal">5</span>
          </div>
          <label class="checkbox-row"><input type="checkbox" id="polyStar"> Als Stern zeichnen</label>
        </div>

        <div class="section" id="textOptions" style="display:none;">
          <h3>🔤 Text</h3>
          <input class="txtinput" id="textContent" placeholder="Dein Text…" style="margin-bottom:8px;">
          <div class="row">
            <label>Größe</label>
            <input type="range" id="fontSize" min="6" max="200" step="1" value="40">
            <span class="valnum" id="fontSizeVal">40</span>
          </div>
          <select id="fontFamily" style="margin-bottom:8px;">
            <option value="Nunito, sans-serif">Nunito (rund)</option>
            <option value="Georgia, serif">Georgia (Serif)</option>
            <option value="'Courier New', monospace">Courier (Mono)</option>
            <option value="Impact, sans-serif">Impact (fett)</option>
            <option value="'Comic Sans MS', cursive">Comic</option>
            <option value="Arial, sans-serif">Arial</option>
          </select>
          <select id="fontWeight">
            <option value="800">Fett</option>
            <option value="400">Normal</option>
            <option value="300">Dünn</option>
          </select>
        </div>

        <div class="section">
          <h3>🧩 Objekt</h3>
          <div class="zbtns" style="margin-bottom:8px;">
            <button class="btn" id="dupBtn">⧉ Duplizieren</button>
            <button class="btn danger" id="delBtn">🗑 Löschen</button>
          </div>
          <div class="zbtns">
            <button class="btn" id="frontBtn">⬆ Nach vorne</button>
            <button class="btn" id="backBtn">⬇ Nach hinten</button>
            <button class="btn" id="flipHBtn">↔ Spiegeln H</button>
            <button class="btn" id="flipVBtn">↕ Spiegeln V</button>
          </div>
        </div>

        <div class="section">
          <h3>📚 Ebenen</h3>
          <div class="layers" id="layersList"><div class="empty">Noch nichts gezeichnet</div></div>
        </div>

        <div class="section">
          <h3>📐 Zeichenfläche</h3>
          <div class="canvas-size">
            <input class="txtinput" type="number" id="canvasW" value="800" min="1">
            <span style="font-weight:900;color:var(--muted);">×</span>
            <input class="txtinput" type="number" id="canvasH" value="600" min="1">
          </div>
          <div class="mini">Breite × Höhe in Pixel</div>
          <div class="row" style="margin-top:10px;">
            <label>Hintergrund</label>
            <div class="swatch-wrap">
              <button class="none-btn on" id="bgNone" title="Transparent"></button>
              <input type="color" id="bgColor" value="#ffffff">
            </div>
          </div>
          <label class="checkbox-row" style="margin-top:6px;"><input type="checkbox" id="showGrid"> Raster anzeigen</label>
          <label class="checkbox-row" style="margin-top:8px;"><input type="checkbox" id="snapGrid"> Am Raster einrasten</label>
          <div class="zbtns" style="margin-top:12px;">
            <button class="btn danger" id="clearBtn" style="grid-column:1/3;">🧹 Alles löschen</button>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
"use strict";
(function(){
  const SVGNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById('canvas');
  const scroll = document.getElementById('canvasScroll');

  // ---- State ----
  let state = {
    w: 800, h: 600,
    bg: '#ffffff', bgOn: false,
    zoom: 1,
    tool: 'select',
    fill: '#7b5cff', fillOn: true,
    stroke: '#1e1140', strokeOn: false,
    strokeWidth: 0,
    opacity: 1,
    corner: 0,
    polySides: 5, polyStar: false,
    fontSize: 40, fontFamily: 'Nunito, sans-serif', fontWeight: '800',
    text: '',
    grid: false, snap: false, gridSize: 20,
  };

  let selected = null;      // selected element
  let idCounter = 1;
  const undoStack = [];
  const redoStack = [];

  // Layers group holds user content; overlay holds handles/grid
  let gGrid = mk('g', {id:'__grid'});
  let gContent = mk('g', {id:'__content'});
  let gOverlay = mk('g', {id:'__overlay'});
  svg.appendChild(gGrid);
  svg.appendChild(gContent);
  svg.appendChild(gOverlay);

  function mk(tag, attrs){
    const el = document.createElementNS(SVGNS, tag);
    if(attrs) for(const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function uid(){ return 's'+(idCounter++); }

  // ---------- Canvas sizing ----------
  function applyCanvasSize(){
    svg.setAttribute('width', state.w * state.zoom);
    svg.setAttribute('height', state.h * state.zoom);
    svg.setAttribute('viewBox', `0 0 ${state.w} ${state.h}`);
    drawGrid();
    updateBg();
    updateOverlay();
  }
  let bgRect = null;
  function updateBg(){
    if(state.bgOn){
      if(!bgRect){ bgRect = mk('rect',{id:'__bg'}); gGrid.parentNode.insertBefore(bgRect, gGrid); }
      bgRect.setAttribute('x',0);bgRect.setAttribute('y',0);
      bgRect.setAttribute('width',state.w);bgRect.setAttribute('height',state.h);
      bgRect.setAttribute('fill',state.bg);
    } else if(bgRect){ bgRect.remove(); bgRect=null; }
  }
  function drawGrid(){
    gGrid.innerHTML='';
    if(!state.grid) return;
    const s = state.gridSize;
    for(let x=s;x<state.w;x+=s) gGrid.appendChild(mk('line',{x1:x,y1:0,x2:x,y2:state.h,stroke:'#e6e0f5','stroke-width':1,'vector-effect':'non-scaling-stroke'}));
    for(let y=s;y<state.h;y+=s) gGrid.appendChild(mk('line',{x1:0,y1:y,x2:state.w,y2:y,stroke:'#e6e0f5','stroke-width':1,'vector-effect':'non-scaling-stroke'}));
  }

  // ---------- Coordinate helper ----------
  function svgPoint(evt){
    const r = svg.getBoundingClientRect();
    const x = (evt.clientX - r.left) / state.zoom;
    const y = (evt.clientY - r.top) / state.zoom;
    return {x, y};
  }
  function snap(v){ return state.snap ? Math.round(v/state.gridSize)*state.gridSize : v; }
  function snapPt(p){ return {x:snap(p.x), y:snap(p.y)}; }

  // ---------- Undo / Redo ----------
  function snapshot(){ return gContent.innerHTML; }
  function pushUndo(){
    undoStack.push(snapshot());
    if(undoStack.length>80) undoStack.shift();
    redoStack.length = 0;
  }
  function restore(html){
    deselect();
    gContent.innerHTML = html;
    // rebind
    renderLayers();
  }
  function undo(){
    if(!undoStack.length) return;
    redoStack.push(snapshot());
    restore(undoStack.pop());
    flash('Rückgängig');
  }
  function redo(){
    if(!redoStack.length) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
    flash('Wiederholt');
  }

  // ---------- Selection & overlay ----------
  function deselect(){
    selected = null;
    updateOverlay();
    renderLayers();
    syncPanelFromSelection();
  }
  function select(el){
    selected = el;
    updateOverlay();
    renderLayers();
    syncPanelFromSelection();
  }

  function getBBox(el){
    try{ return el.getBBox(); }catch(e){ return {x:0,y:0,width:0,height:0}; }
  }
  // current transform rotation of element (we store as data-rot + data-cx/cy)
  function getRot(el){ return parseFloat(el.dataset.rot||'0'); }
  function setRot(el, deg, cx, cy){
    el.dataset.rot = deg;
    if(deg){ el.setAttribute('transform', `rotate(${deg} ${cx} ${cy})`); }
    else el.removeAttribute('transform');
  }

  function updateOverlay(){
    gOverlay.innerHTML='';
    if(!selected) return;
    if(state.tool==='node' && (selected.tagName==='path'||selected.tagName==='polygon'||selected.tagName==='polyline'||selected.tagName==='line')){
      drawNodeEditor();
      return;
    }
    const b = getBBox(selected);
    const rot = getRot(selected);
    const cx = b.x+b.width/2, cy=b.y+b.height/2;
    const g = mk('g');
    if(rot) g.setAttribute('transform',`rotate(${rot} ${cx} ${cy})`);
    g.appendChild(mk('rect',{class:'selbox',x:b.x,y:b.y,width:b.width,height:b.height}));
    const hs = 5/state.zoom;
    const corners = [
      ['nw',b.x,b.y],['ne',b.x+b.width,b.y],
      ['se',b.x+b.width,b.y+b.height],['sw',b.x,b.y+b.height],
      ['n',b.x+b.width/2,b.y],['s',b.x+b.width/2,b.y+b.height],
      ['e',b.x+b.width,b.y+b.height/2],['w',b.x,b.y+b.height/2],
    ];
    corners.forEach(([pos,x,y])=>{
      const h = mk('rect',{class:'h-corner handle',x:x-hs,y:y-hs,width:hs*2,height:hs*2,rx:2/state.zoom});
      h.dataset.handle=pos;
      h.style.cursor = (pos==='nw'||pos==='se')?'nwse-resize':(pos==='ne'||pos==='sw')?'nesw-resize':(pos==='n'||pos==='s')?'ns-resize':'ew-resize';
      g.appendChild(h);
    });
    // rotate handle
    const ry = b.y - 26/state.zoom;
    g.appendChild(mk('line',{class:'h-line',x1:cx,y1:b.y,x2:cx,y2:ry}));
    const rh = mk('circle',{class:'h-rot handle',cx:cx,cy:ry,r:hs+1});
    rh.dataset.handle='rotate';
    rh.style.cursor='grab';
    g.appendChild(rh);
    gOverlay.appendChild(g);
  }

  // ---------- Node editor ----------
  let pathPoints = null; // parsed absolute points for editing
  function drawNodeEditor(){
    const el = selected;
    const pts = extractPoints(el);
    if(!pts) return;
    const g = mk('g');
    // connective line
    pts.forEach((p,i)=>{
      const h = mk('circle',{class:'h-node handle',cx:p.x,cy:p.y,r:6/state.zoom});
      h.dataset.node=i;
      g.appendChild(h);
    });
    gOverlay.appendChild(g);
  }
  function extractPoints(el){
    if(el.tagName==='polygon'||el.tagName==='polyline'){
      return (el.getAttribute('points')||'').trim().split(/\s+/).map(pr=>{const[a,b]=pr.split(',').map(Number);return{x:a,y:b};}).filter(p=>!isNaN(p.x));
    }
    if(el.tagName==='line'){
      return [{x:+el.getAttribute('x1'),y:+el.getAttribute('y1')},{x:+el.getAttribute('x2'),y:+el.getAttribute('y2')}];
    }
    if(el.tagName==='path'){
      return parsePathNodes(el.getAttribute('d'));
    }
    return null;
  }
  function parsePathNodes(d){
    // simple: capture anchor points of M/L/C(end)/Q(end) commands
    const nodes=[]; const re=/([MLCQ])([^MLCQZz]*)/g; let m;
    while((m=re.exec(d))){
      const cmd=m[1]; const nums=(m[2].match(/-?\d*\.?\d+/g)||[]).map(Number);
      if(cmd==='M'||cmd==='L'){ nodes.push({x:nums[0],y:nums[1]}); }
      else if(cmd==='C'){ nodes.push({x:nums[4],y:nums[5]}); }
      else if(cmd==='Q'){ nodes.push({x:nums[2],y:nums[3]}); }
    }
    return nodes;
  }
  function setNode(el, idx, p){
    if(el.tagName==='polygon'||el.tagName==='polyline'){
      const pts=extractPoints(el); pts[idx]=p;
      el.setAttribute('points', pts.map(q=>`${round(q.x)},${round(q.y)}`).join(' '));
    } else if(el.tagName==='line'){
      if(idx===0){el.setAttribute('x1',round(p.x));el.setAttribute('y1',round(p.y));}
      else {el.setAttribute('x2',round(p.x));el.setAttribute('y2',round(p.y));}
    } else if(el.tagName==='path'){
      moveePathNode(el, idx, p);
    }
  }
  function moveePathNode(el, idx, p){
    let d=el.getAttribute('d'); let i=-1;
    const re=/([MLCQ])([^MLCQZz]*)/g; let m; const parts=[];
    while((m=re.exec(d))){ parts.push({cmd:m[1],nums:(m[2].match(/-?\d*\.?\d+/g)||[]).map(Number)}); }
    let count=-1;
    for(const part of parts){
      if('MLCQ'.includes(part.cmd)) count++;
      if(count===idx){
        const n=part.nums;
        if(part.cmd==='M'||part.cmd==='L'){n[0]=p.x;n[1]=p.y;}
        else if(part.cmd==='C'){n[4]=p.x;n[5]=p.y;}
        else if(part.cmd==='Q'){n[2]=p.x;n[3]=p.y;}
        break;
      }
    }
    let out='';
    for(const part of parts){ out += part.cmd + part.nums.map(round).join(' ')+' '; }
    if(/[Zz]\s*$/.test(el.getAttribute('d'))) out+='Z';
    el.setAttribute('d', out.trim());
  }
  function round(n){ return Math.round(n*100)/100; }

  // ---------- Styling helpers ----------
  function applyStyleAttrs(el){
    el.setAttribute('fill', state.fillOn ? state.fill : 'none');
    if(state.strokeOn){
      el.setAttribute('stroke', state.stroke);
      el.setAttribute('stroke-width', state.strokeWidth);
      el.setAttribute('stroke-linejoin','round');
      el.setAttribute('stroke-linecap','round');
    } else {
      el.setAttribute('stroke','none');
      el.removeAttribute('stroke-width');
    }
    el.setAttribute('opacity', state.opacity);
  }

  // ---------- Tool handling ----------
  let action = null; // current drag action

  svg.addEventListener('pointerdown', onDown);
  svg.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);

  function onDown(e){
    const p = svgPoint(e);
    svg.setPointerCapture && svg.setPointerCapture(e.pointerId);

    // handle interaction first
    const handleEl = e.target.closest('.handle');
    if(handleEl && selected){
      if(handleEl.dataset.node!==undefined){
        pushUndo();
        action={type:'node',idx:+handleEl.dataset.node};
        return;
      }
      const h=handleEl.dataset.handle;
      pushUndo();
      if(h==='rotate'){
        const b=getBBox(selected);
        action={type:'rotate',cx:b.x+b.width/2,cy:b.y+b.height/2,startRot:getRot(selected),startAng:Math.atan2(p.y-(b.y+b.height/2),p.x-(b.x+b.width/2))};
      } else {
        const b=getBBox(selected);
        const orig={...b};
        if(selected.tagName==='polygon'||selected.tagName==='polyline') orig.points=selected.getAttribute('points');
        if(selected.tagName==='path') orig.d=selected.getAttribute('d');
        action={type:'resize',handle:h,b:orig,start:p};
      }
      return;
    }

    if(state.tool==='select' || state.tool==='node'){
      const target = e.target.closest('#__content > *');
      if(target){
        if(target!==selected) select(target);
        if(state.tool==='select'){
          pushUndo();
          const b=getBBox(target);
          action={type:'move',start:p,orig:captureGeom(target)};
        }
      } else {
        deselect();
      }
      return;
    }

    // Drawing tools
    if(state.tool==='pen'){ penDown(p,e); return; }
    if(state.tool==='pencil'){ pencilDown(p); return; }
    if(state.tool==='text'){ placeText(p); return; }

    // shape drag-create
    pushUndo();
    const start = snapPt(p);
    let el;
    if(state.tool==='rect') el=mk('rect',{x:start.x,y:start.y,width:0,height:0,rx:state.corner});
    else if(state.tool==='ellipse') el=mk('ellipse',{cx:start.x,cy:start.y,rx:0,ry:0});
    else if(state.tool==='line') el=mk('line',{x1:start.x,y1:start.y,x2:start.x,y2:start.y});
    else if(state.tool==='polygon') el=mk('polygon',{points:`${start.x},${start.y}`});
    if(!el) return;
    el.id=uid();
    applyStyleAttrs(el);
    if(state.tool==='line' && !state.strokeOn){ // line needs stroke to show
      el.setAttribute('stroke',state.stroke); el.setAttribute('stroke-width', state.strokeWidth||3);
    }
    gContent.appendChild(el);
    select(el);
    action={type:'create',tool:state.tool,start,el};
  }

  function onMove(e){
    if(!action) return;
    const p = svgPoint(e);
    const sp = snapPt(p);

    if(action.type==='create'){
      const el=action.el, s=action.start;
      if(action.tool==='rect'){
        const x=Math.min(s.x,sp.x),y=Math.min(s.y,sp.y);
        let w=Math.abs(sp.x-s.x),h=Math.abs(sp.y-s.y);
        if(e.shiftKey){const m=Math.max(w,h);w=h=m;}
        el.setAttribute('x',x);el.setAttribute('y',y);el.setAttribute('width',w);el.setAttribute('height',h);
      } else if(action.tool==='ellipse'){
        let rx=Math.abs(sp.x-s.x)/2, ry=Math.abs(sp.y-s.y)/2;
        if(e.shiftKey){const m=Math.max(rx,ry);rx=ry=m;}
        el.setAttribute('cx',s.x+(sp.x-s.x)/2);el.setAttribute('cy',s.y+(sp.y-s.y)/2);
        el.setAttribute('rx',rx);el.setAttribute('ry',ry);
      } else if(action.tool==='line'){
        let ex=sp.x,ey=sp.y;
        if(e.shiftKey){ const dx=ex-s.x,dy=ey-s.y; const ang=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4); const len=Math.hypot(dx,dy); ex=s.x+Math.cos(ang)*len; ey=s.y+Math.sin(ang)*len; }
        el.setAttribute('x2',ex);el.setAttribute('y2',ey);
      } else if(action.tool==='polygon'){
        const cx=s.x, cy=s.y;
        const rx=sp.x-s.x, ry=sp.y-s.y;
        const rad=Math.hypot(rx,ry);
        const rot=Math.atan2(ry,rx);
        el.setAttribute('points', polyPoints(cx,cy,rad,state.polySides,rot,state.polyStar));
      }
      updateOverlay();
      return;
    }
    if(action.type==='move'){
      let dx=p.x-action.start.x, dy=p.y-action.start.y;
      if(state.snap){ dx=snap(dx); dy=snap(dy); }
      applyGeom(selected, action.orig, dx, dy);
      updateOverlay();
      return;
    }
    if(action.type==='resize'){
      doResize(p, e.shiftKey);
      updateOverlay();
      return;
    }
    if(action.type==='rotate'){
      const ang=Math.atan2(p.y-action.cy,p.x-action.cx);
      let deg=action.startRot + (ang-action.startAng)*180/Math.PI;
      if(e.shiftKey) deg=Math.round(deg/15)*15;
      setRot(selected, round(deg), action.cx, action.cy);
      updateOverlay();
      return;
    }
    if(action.type==='node'){
      setNode(selected, action.idx, sp);
      updateOverlay();
      return;
    }
    if(action.type==='pencil'){
      action.pts.push(p);
      selected.setAttribute('d', smoothPath(action.pts));
      return;
    }
  }

  function onUp(e){
    if(!action) return;
    if(action.type==='create'){
      // remove zero-size shapes
      const b=getBBox(action.el);
      if(action.tool!=='line' && (b.width<2 && b.height<2)){
        action.el.remove(); deselect();
      } else if(action.tool==='line'){
        if(action.el.getAttribute('x1')===action.el.getAttribute('x2') && action.el.getAttribute('y1')===action.el.getAttribute('y2')){ action.el.remove(); deselect(); }
      }
      renderLayers();
    }
    if(action.type==='pencil'){
      if(action.pts.length<2){ selected.remove(); deselect(); }
      renderLayers();
    }
    action=null;
  }

  // geometry capture for move (per shape type)
  function captureGeom(el){
    const t=el.tagName; const g={};
    if(t==='rect'||t==='image'){g.x=+el.getAttribute('x');g.y=+el.getAttribute('y');}
    else if(t==='ellipse'||t==='circle'){g.cx=+el.getAttribute('cx');g.cy=+el.getAttribute('cy');}
    else if(t==='line'){g.x1=+el.getAttribute('x1');g.y1=+el.getAttribute('y1');g.x2=+el.getAttribute('x2');g.y2=+el.getAttribute('y2');}
    else if(t==='text'){g.x=+el.getAttribute('x');g.y=+el.getAttribute('y');}
    else if(t==='polygon'||t==='polyline'){g.points=el.getAttribute('points');}
    else if(t==='path'){g.d=el.getAttribute('d');}
    g.rot=getRot(el);
    return g;
  }
  function applyGeom(el, g, dx, dy){
    const t=el.tagName;
    if(t==='rect'||t==='image'||t==='text'){el.setAttribute('x',round(g.x+dx));el.setAttribute('y',round(g.y+dy));}
    else if(t==='ellipse'||t==='circle'){el.setAttribute('cx',round(g.cx+dx));el.setAttribute('cy',round(g.cy+dy));}
    else if(t==='line'){el.setAttribute('x1',round(g.x1+dx));el.setAttribute('y1',round(g.y1+dy));el.setAttribute('x2',round(g.x2+dx));el.setAttribute('y2',round(g.y2+dy));}
    else if(t==='polygon'||t==='polyline'){el.setAttribute('points', g.points.trim().split(/\s+/).map(pr=>{const[a,b]=pr.split(',').map(Number);return `${round(a+dx)},${round(b+dy)}`;}).join(' '));}
    else if(t==='path'){el.setAttribute('d', translatePath(g.d, dx, dy));}
    if(g.rot){ const b=getBBox(el); setRot(el,g.rot,b.x+b.width/2,b.y+b.height/2); }
  }
  function translatePath(d, dx, dy){
    let idx=0;
    return d.replace(/-?\d*\.?\d+/g, (num)=>{
      const v=parseFloat(num); const r = (idx%2===0)?v+dx:v+dy; idx++; return round(r);
    });
  }

  // resize
  function doResize(p, keepRatio){
    const el=selected, h=action.handle, b=action.b;
    let x1=b.x, y1=b.y, x2=b.x+b.width, y2=b.y+b.height;
    if(h.includes('w')) x1=p.x;
    if(h.includes('e')) x2=p.x;
    if(h.includes('n')) y1=p.y;
    if(h.includes('s')) y2=p.y;
    let nx=Math.min(x1,x2), ny=Math.min(y1,y2), nw=Math.abs(x2-x1), nh=Math.abs(y2-y1);
    if(keepRatio && b.width && b.height){
      const ratio=b.width/b.height;
      if(nw/nh > ratio) nw=nh*ratio; else nh=nw/ratio;
    }
    if(nw<1)nw=1; if(nh<1)nh=1;
    scaleElementTo(el, b, nx, ny, nw, nh);
  }
  function scaleElementTo(el, b, nx, ny, nw, nh){
    const sx = b.width? nw/b.width : 1;
    const sy = b.height? nh/b.height : 1;
    const t=el.tagName;
    const fx = x => nx + (x-b.x)*sx;
    const fy = y => ny + (y-b.y)*sy;
    if(t==='rect'){el.setAttribute('x',round(nx));el.setAttribute('y',round(ny));el.setAttribute('width',round(nw));el.setAttribute('height',round(nh));}
    else if(t==='ellipse'){el.setAttribute('cx',round(nx+nw/2));el.setAttribute('cy',round(ny+nh/2));el.setAttribute('rx',round(nw/2));el.setAttribute('ry',round(nh/2));}
    else if(t==='circle'){el.setAttribute('cx',round(nx+nw/2));el.setAttribute('cy',round(ny+nh/2));el.setAttribute('r',round(Math.min(nw,nh)/2));}
    else if(t==='line'){el.setAttribute('x1',round(fx(+el.getAttribute('x1'))));el.setAttribute('y1',round(fy(+el.getAttribute('y1'))));el.setAttribute('x2',round(fx(+el.getAttribute('x2'))));el.setAttribute('y2',round(fy(+el.getAttribute('y2'))));}
    else if(t==='text'){ const cur=+el.getAttribute('font-size')||state.fontSize; el.setAttribute('font-size', round(cur*sy)); el.setAttribute('x',round(fx(+el.getAttribute('x')))); el.setAttribute('y',round(fy(+el.getAttribute('y')))); }
    else if(t==='polygon'||t==='polyline'){el.setAttribute('points', (action.b.points||el.getAttribute('points')).trim().split(/\s+/).map(pr=>{const[a,c]=pr.split(',').map(Number);return `${round(fx(a))},${round(fy(c))}`;}).join(' '));}
    else if(t==='path'){ el.setAttribute('d', scalePath(action.b.d||el.getAttribute('d'), fx, fy)); }
    if(getRot(el)){ setRot(el, getRot(el), nx+nw/2, ny+nh/2); }
  }
  // store original geometry for polygon/path scaling at resize start
  function scalePath(d, fx, fy){
    let idx=0;
    return d.replace(/-?\d*\.?\d+/g,(num)=>{ const v=parseFloat(num); const r=(idx%2===0)?fx(v):fy(v); idx++; return round(r); });
  }

  // ---------- Polygon / star ----------
  function polyPoints(cx,cy,r,sides,rot,star){
    let pts=[];
    const n = star? sides*2 : sides;
    for(let i=0;i<n;i++){
      const rad = (star && i%2) ? r*0.42 : r;
      const a = rot - Math.PI/2 + i*2*Math.PI/n;
      pts.push(`${round(cx+Math.cos(a)*rad)},${round(cy+Math.sin(a)*rad)}`);
    }
    return pts.join(' ');
  }

  // ---------- Pen (bezier path) ----------
  let pen = null;
  function penDown(p, e){
    const sp=snapPt(p);
    if(!pen){
      pushUndo();
      const el=mk('path',{d:`M ${sp.x} ${sp.y}`});
      el.id=uid(); applyStyleAttrs(el);
      if(!state.strokeOn){el.setAttribute('stroke',state.stroke);el.setAttribute('stroke-width',state.strokeWidth||3);}
      gContent.appendChild(el);
      pen={el, pts:[sp]};
      select(el);
      flash('Klicke für weitere Punkte · Doppelklick / Enter beendet · Esc bricht ab');
    } else {
      // close if near start
      const first=pen.pts[0];
      if(Math.hypot(sp.x-first.x, sp.y-first.y) < 8){ finishPen(true); return; }
      pen.pts.push(sp);
      rebuildPen();
    }
  }
  function rebuildPen(){
    const pts=pen.pts;
    let d=`M ${pts[0].x} ${pts[0].y}`;
    for(let i=1;i<pts.length;i++) d+=` L ${pts[i].x} ${pts[i].y}`;
    pen.el.setAttribute('d', d);
    updateOverlay();
  }
  function finishPen(close){
    if(!pen) return;
    if(pen.pts.length<2){ pen.el.remove(); pen=null; deselect(); return; }
    if(close){ pen.el.setAttribute('d', pen.el.getAttribute('d')+' Z'); if(state.fillOn) pen.el.setAttribute('fill',state.fill); }
    const el=pen.el; pen=null;
    select(el); renderLayers();
    flash('Pfad fertig ✓');
  }
  // preview line follows cursor while pen active
  svg.addEventListener('pointermove',(e)=>{
    if(!pen) return;
    const p=snapPt(svgPoint(e));
    const pts=pen.pts;
    let d=`M ${pts[0].x} ${pts[0].y}`;
    for(let i=1;i<pts.length;i++) d+=` L ${pts[i].x} ${pts[i].y}`;
    d+=` L ${p.x} ${p.y}`;
    pen.el.setAttribute('d', d);
  });
  svg.addEventListener('dblclick',(e)=>{ if(pen) finishPen(false); });

  // ---------- Pencil (freehand) ----------
  function pencilDown(p){
    pushUndo();
    const el=mk('path',{d:`M ${round(p.x)} ${round(p.y)}`,fill:'none'});
    el.id=uid();
    el.setAttribute('stroke', state.strokeOn?state.stroke:state.fill);
    el.setAttribute('stroke-width', state.strokeOn?(state.strokeWidth||3):3);
    el.setAttribute('stroke-linecap','round');el.setAttribute('stroke-linejoin','round');
    el.setAttribute('opacity',state.opacity);
    gContent.appendChild(el);
    select(el);
    action={type:'pencil',pts:[p]};
  }
  function smoothPath(pts){
    if(pts.length<2) return `M ${round(pts[0].x)} ${round(pts[0].y)}`;
    let d=`M ${round(pts[0].x)} ${round(pts[0].y)}`;
    for(let i=1;i<pts.length-1;i++){
      const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
      d+=` Q ${round(pts[i].x)} ${round(pts[i].y)} ${round(mx)} ${round(my)}`;
    }
    const last=pts[pts.length-1];
    d+=` L ${round(last.x)} ${round(last.y)}`;
    return d;
  }

  // ---------- Text ----------
  function placeText(p){
    const content = state.text || prompt('Text eingeben:', 'Hallo!');
    if(content===null) return;
    if(!content.trim()){ return; }
    pushUndo();
    const el=mk('text',{x:round(p.x),y:round(p.y)});
    el.id=uid();
    el.setAttribute('font-size',state.fontSize);
    el.setAttribute('font-family',state.fontFamily);
    el.setAttribute('font-weight',state.fontWeight);
    el.setAttribute('fill', state.fillOn?state.fill:'#000');
    if(state.strokeOn){el.setAttribute('stroke',state.stroke);el.setAttribute('stroke-width',state.strokeWidth);}
    el.setAttribute('opacity',state.opacity);
    el.textContent=content;
    gContent.appendChild(el);
    document.getElementById('textContent').value=content;
    state.text=content;
    select(el);
    renderLayers();
    setTool('select');
  }

  // ---------- Panel sync ----------
  function syncPanelFromSelection(){
    // show/hide contextual sections
    document.getElementById('cornerRow').style.display = (selected && selected.tagName==='rect')?'flex':'none';
    document.getElementById('textOptions').style.display = (selected && selected.tagName==='text')?'block':(state.tool==='text'?'block':'none');
    document.getElementById('polyOptions').style.display = (state.tool==='polygon' || (selected && selected.tagName==='polygon'))?'block':'none';
    if(!selected) return;
    const el=selected;
    const fill=el.getAttribute('fill');
    if(fill && fill!=='none'){ state.fillOn=true; if(fill.startsWith('#')){state.fill=fill; document.getElementById('fillColor').value=normHex(fill);} }
    else state.fillOn=false;
    const stroke=el.getAttribute('stroke');
    if(stroke && stroke!=='none'){ state.strokeOn=true; if(stroke.startsWith('#')){state.stroke=stroke;document.getElementById('strokeColor').value=normHex(stroke);} state.strokeWidth=+el.getAttribute('stroke-width')||0; }
    else state.strokeOn=false;
    state.opacity=el.getAttribute('opacity')!==null?+el.getAttribute('opacity'):1;
    if(el.tagName==='rect') state.corner=+el.getAttribute('rx')||0;
    if(el.tagName==='text'){
      state.fontSize=+el.getAttribute('font-size')||40;
      document.getElementById('textContent').value=el.textContent;
      document.getElementById('fontSize').value=state.fontSize;
      document.getElementById('fontSizeVal').textContent=state.fontSize;
    }
    refreshControls();
  }
  function normHex(h){
    if(/^#[0-9a-f]{3}$/i.test(h)) return '#'+h.slice(1).split('').map(c=>c+c).join('');
    return /^#[0-9a-f]{6}$/i.test(h)?h:'#000000';
  }
  function refreshControls(){
    document.getElementById('fillColor').value = normHex(state.fill);
    document.getElementById('strokeColor').value = normHex(state.stroke);
    document.getElementById('fillNone').classList.toggle('on', !state.fillOn);
    document.getElementById('strokeNone').classList.toggle('on', !state.strokeOn);
    document.getElementById('strokeWidth').value=state.strokeWidth;
    document.getElementById('strokeWidthVal').textContent=state.strokeWidth;
    document.getElementById('opacity').value=Math.round(state.opacity*100);
    document.getElementById('opacityVal').textContent=Math.round(state.opacity*100);
    document.getElementById('cornerRadius').value=state.corner;
    document.getElementById('cornerRadiusVal').textContent=state.corner;
  }

  // apply live style edits to selected element
  function styleChanged(){
    if(!selected) return;
    const el=selected;
    if(el.tagName==='text'){
      el.setAttribute('fill', state.fillOn?state.fill:'none');
    } else {
      el.setAttribute('fill', state.fillOn?state.fill:'none');
    }
    if(state.strokeOn){
      el.setAttribute('stroke',state.stroke);
      el.setAttribute('stroke-width',state.strokeWidth);
      el.setAttribute('stroke-linejoin','round');el.setAttribute('stroke-linecap','round');
    } else { el.setAttribute('stroke','none'); }
    el.setAttribute('opacity',state.opacity);
    if(el.tagName==='rect') el.setAttribute('rx',state.corner);
    renderLayers();
  }

  // ---------- Layers ----------
  function renderLayers(){
    const list=document.getElementById('layersList');
    const els=[...gContent.children].reverse();
    if(!els.length){ list.innerHTML='<div class="empty">Noch nichts gezeichnet</div>'; return; }
    list.innerHTML='';
    els.forEach(el=>{
      const item=document.createElement('div');
      item.className='layer-item'+(el===selected?' sel':'');
      const sw=document.createElement('div'); sw.className='lswatch';
      const f=el.getAttribute('fill'); sw.style.background=(f&&f!=='none')?f:(el.getAttribute('stroke')||'#ccc');
      const name=document.createElement('div'); name.className='lname'; name.textContent=layerName(el);
      const hideBtn=document.createElement('button'); hideBtn.className='lbtn';
      const hidden=el.style.display==='none';
      hideBtn.innerHTML = hidden
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><line x1="3" y1="3" x2="21" y2="21"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
      hideBtn.title='Ein-/Ausblenden';
      hideBtn.onclick=(ev)=>{ ev.stopPropagation(); el.style.display=hidden?'':'none'; renderLayers(); };
      item.appendChild(sw); item.appendChild(name); item.appendChild(hideBtn);
      item.onclick=()=>{ select(el); };
      list.appendChild(item);
    });
  }
  function layerName(el){
    const map={rect:'Rechteck',ellipse:'Ellipse',circle:'Kreis',line:'Linie',polygon:state.polyStar?'Stern':'Vieleck',polyline:'Linienzug',path:'Pfad',text:'„'+(el.textContent||'').slice(0,14)+'"',image:'Bild'};
    return map[el.tagName]||el.tagName;
  }

  // ---------- Object ops ----------
  function duplicate(){
    if(!selected) return;
    pushUndo();
    const c=selected.cloneNode(true);
    c.id=uid();
    // offset
    const g=captureGeom(selected); applyGeom(c,g,15,15);
    gContent.appendChild(c);
    select(c); renderLayers();
  }
  function del(){
    if(!selected) return;
    pushUndo();
    selected.remove(); deselect();
  }
  function toFront(){ if(!selected)return; pushUndo(); gContent.appendChild(selected); renderLayers(); }
  function toBack(){ if(!selected)return; pushUndo(); gContent.insertBefore(selected, gContent.firstChild); renderLayers(); }
  function flip(horizontal){
    if(!selected) return; pushUndo();
    const b=getBBox(selected);
    const cx=b.x+b.width/2, cy=b.y+b.height/2;
    const fx = horizontal? x=>2*cx-x : x=>x;
    const fy = horizontal? y=>y : y=>2*cy-y;
    scalePathLike(selected, fx, fy);
    updateOverlay();
  }
  function scalePathLike(el, fx, fy){
    const t=el.tagName;
    if(t==='rect'){ const x=+el.getAttribute('x'),w=+el.getAttribute('width'); el.setAttribute('x', round(Math.min(fx(x),fx(x+w)))); const y=+el.getAttribute('y'),h=+el.getAttribute('height'); el.setAttribute('y',round(Math.min(fy(y),fy(y+h)))); }
    else if(t==='ellipse'||t==='circle'){ el.setAttribute('cx',round(fx(+el.getAttribute('cx')))); el.setAttribute('cy',round(fy(+el.getAttribute('cy')))); }
    else if(t==='line'){ el.setAttribute('x1',round(fx(+el.getAttribute('x1'))));el.setAttribute('x2',round(fx(+el.getAttribute('x2'))));el.setAttribute('y1',round(fy(+el.getAttribute('y1'))));el.setAttribute('y2',round(fy(+el.getAttribute('y2')))); }
    else if(t==='text'){ el.setAttribute('x',round(fx(+el.getAttribute('x')))); }
    else if(t==='polygon'||t==='polyline'){ el.setAttribute('points', el.getAttribute('points').trim().split(/\s+/).map(pr=>{const[a,c]=pr.split(',').map(Number);return `${round(fx(a))},${round(fy(c))}`;}).join(' ')); }
    else if(t==='path'){ el.setAttribute('d', scalePath(el.getAttribute('d'), fx, fy)); }
  }

  // ---------- Tools UI ----------
  function setTool(t){
    // finish any pen in progress
    if(pen && t!=='pen') finishPen(false);
    state.tool=t;
    document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active', b.dataset.tool===t));
    svg.style.cursor = (t==='select')?'default':(t==='text')?'text':'crosshair';
    const hints={
      select:'Klicke & ziehe Objekte · Anfasser zum Skalieren/Drehen',
      node:'Klicke ein Objekt, dann ziehe die Punkte',
      rect:'Ziehen zum Zeichnen · Shift = Quadrat',
      ellipse:'Ziehen zum Zeichnen · Shift = Kreis',
      line:'Ziehen · Shift = 45°-Winkel',
      polygon:'Ziehen zum Aufziehen · Ecken/Stern rechts einstellen',
      pen:'Klicke Punkte · Doppelklick beendet · nahe Start = schließen',
      pencil:'Ziehen zum Freihand-Zeichnen',
      text:'Klicke, um Text zu platzieren',
    };
    flash(hints[t]||'');
    syncPanelFromSelection();
    if(t!=='select' && t!=='node') deselect();
  }

  document.getElementById('toolbar').addEventListener('click',(e)=>{
    const b=e.target.closest('.tool'); if(b) setTool(b.dataset.tool);
  });

  // ---------- Hint flash ----------
  let hintTimer=null;
  function flash(msg){
    const h=document.getElementById('hint');
    if(!msg){ h.classList.remove('show'); return; }
    h.textContent=msg; h.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer=setTimeout(()=>h.classList.remove('show'),2600);
  }

  // ---------- Zoom ----------
  function setZoom(z){
    state.zoom=Math.max(0.1,Math.min(8,z));
    document.getElementById('zoomVal').textContent=Math.round(state.zoom*100)+'%';
    applyCanvasSize();
  }
  function fitZoom(){
    const pad=120;
    const availW=scroll.clientWidth-pad, availH=scroll.clientHeight-pad;
    setZoom(Math.min(availW/state.w, availH/state.h, 4));
  }
  document.getElementById('zoomIn').onclick=()=>setZoom(state.zoom*1.2);
  document.getElementById('zoomOut').onclick=()=>setZoom(state.zoom/1.2);
  document.getElementById('zoomFit').onclick=fitZoom;
  scroll.addEventListener('wheel',(e)=>{
    if(e.ctrlKey||e.metaKey){ e.preventDefault(); setZoom(state.zoom*(e.deltaY<0?1.1:0.9)); }
  },{passive:false});

  // ---------- Controls bindings ----------
  function palette(){
    const cols=['#1e1140','#7b5cff','#ff6ba6','#22c1a6','#ff8a3d','#ffd23f','#3fa9ff','#ff5b7f',
                '#ffffff','#9aa0b5','#12d18e','#00b3ff','#c04cff','#ff3d68','#8d5a2b','#000000'];
    const p=document.getElementById('fillPalette');
    cols.forEach(c=>{ const b=document.createElement('button'); b.style.background=c; b.onclick=()=>{ state.fill=c; state.fillOn=true; refreshControls(); styleChanged(); }; p.appendChild(b); });
  }
  palette();

  document.getElementById('fillColor').addEventListener('input',e=>{ state.fill=e.target.value; state.fillOn=true; document.getElementById('fillNone').classList.remove('on'); styleChanged(); });
  document.getElementById('strokeColor').addEventListener('input',e=>{ state.stroke=e.target.value; state.strokeOn=true; document.getElementById('strokeNone').classList.remove('on'); if(state.strokeWidth===0){state.strokeWidth=3;refreshControls();} styleChanged(); });
  document.getElementById('fillNone').addEventListener('click',()=>{ state.fillOn=!state.fillOn; refreshControls(); styleChanged(); });
  document.getElementById('strokeNone').addEventListener('click',()=>{ state.strokeOn=!state.strokeOn; if(state.strokeOn && state.strokeWidth===0)state.strokeWidth=3; refreshControls(); styleChanged(); });
  document.getElementById('strokeWidth').addEventListener('input',e=>{ state.strokeWidth=+e.target.value; state.strokeOn=state.strokeWidth>0?true:state.strokeOn; document.getElementById('strokeWidthVal').textContent=e.target.value; styleChanged(); });
  document.getElementById('opacity').addEventListener('input',e=>{ state.opacity=+e.target.value/100; document.getElementById('opacityVal').textContent=e.target.value; styleChanged(); });
  document.getElementById('cornerRadius').addEventListener('input',e=>{ state.corner=+e.target.value; document.getElementById('cornerRadiusVal').textContent=e.target.value; styleChanged(); });

  document.getElementById('polySides').addEventListener('input',e=>{ state.polySides=+e.target.value; document.getElementById('polySidesVal').textContent=e.target.value; regenPoly(); });
  document.getElementById('polyStar').addEventListener('change',e=>{ state.polyStar=e.target.checked; regenPoly(); });
  function regenPoly(){
    if(selected && selected.tagName==='polygon'){
      const b=getBBox(selected); const cx=b.x+b.width/2, cy=b.y+b.height/2; const r=Math.max(b.width,b.height)/2;
      pushUndo();
      selected.setAttribute('points', polyPoints(cx,cy,r,state.polySides,-Math.PI/2+Math.PI/2,state.polyStar));
      updateOverlay();
    }
  }

  document.getElementById('textContent').addEventListener('input',e=>{ state.text=e.target.value; if(selected&&selected.tagName==='text'){ selected.textContent=e.target.value; renderLayers(); } });
  document.getElementById('fontSize').addEventListener('input',e=>{ state.fontSize=+e.target.value; document.getElementById('fontSizeVal').textContent=e.target.value; if(selected&&selected.tagName==='text'){ selected.setAttribute('font-size',state.fontSize);} });
  document.getElementById('fontFamily').addEventListener('change',e=>{ state.fontFamily=e.target.value; if(selected&&selected.tagName==='text') selected.setAttribute('font-family',state.fontFamily); });
  document.getElementById('fontWeight').addEventListener('change',e=>{ state.fontWeight=e.target.value; if(selected&&selected.tagName==='text') selected.setAttribute('font-weight',state.fontWeight); });

  document.getElementById('dupBtn').onclick=duplicate;
  document.getElementById('delBtn').onclick=del;
  document.getElementById('frontBtn').onclick=toFront;
  document.getElementById('backBtn').onclick=toBack;
  document.getElementById('flipHBtn').onclick=()=>flip(true);
  document.getElementById('flipVBtn').onclick=()=>flip(false);
  document.getElementById('undoBtn').onclick=undo;
  document.getElementById('redoBtn').onclick=redo;

  document.getElementById('clearBtn').onclick=()=>{ if(confirm('Wirklich alles löschen?')){ pushUndo(); gContent.innerHTML=''; deselect(); } };

  // canvas settings
  document.getElementById('canvasW').addEventListener('change',e=>{ state.w=Math.max(1,+e.target.value||1); applyCanvasSize(); });
  document.getElementById('canvasH').addEventListener('change',e=>{ state.h=Math.max(1,+e.target.value||1); applyCanvasSize(); });
  document.getElementById('bgColor').addEventListener('input',e=>{ state.bg=e.target.value; state.bgOn=true; document.getElementById('bgNone').classList.remove('on'); updateBg(); });
  document.getElementById('bgNone').addEventListener('click',()=>{ state.bgOn=!state.bgOn; document.getElementById('bgNone').classList.toggle('on',!state.bgOn); updateBg(); });
  document.getElementById('showGrid').addEventListener('change',e=>{ state.grid=e.target.checked; drawGrid(); });
  document.getElementById('snapGrid').addEventListener('change',e=>{ state.snap=e.target.checked; });

  // ---------- Keyboard ----------
  window.addEventListener('keydown',(e)=>{
    if(e.target.matches('input,select,textarea')) return;
    const k=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey)){
      if(k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
      if(k==='y'){ e.preventDefault(); redo(); return; }
      if(k==='d'){ e.preventDefault(); duplicate(); return; }
      if(k==='a'){ e.preventDefault(); return; }
      return;
    }
    const tools={v:'select',a:'node',r:'rect',o:'ellipse',l:'line',p:'polygon',b:'pen',f:'pencil',t:'text'};
    if(tools[k]){ setTool(tools[k]); return; }
    if(k==='delete'||k==='backspace'){ e.preventDefault(); del(); return; }
    if(k==='escape'){ if(pen){ pen.el.remove(); pen=null; deselect(); } else deselect(); return; }
    if(k==='enter'){ if(pen) finishPen(false); return; }
    // arrow nudging
    if(selected && ['arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
      e.preventDefault();
      const step=e.shiftKey?10:1;
      let dx=0,dy=0;
      if(k==='arrowup')dy=-step; if(k==='arrowdown')dy=step; if(k==='arrowleft')dx=-step; if(k==='arrowright')dx=step;
      const g=captureGeom(selected); applyGeom(selected,g,dx,dy); updateOverlay();
    }
  });

  // ---------- Export ----------
  function serialize(){
    const clone = svg.cloneNode(true);
    // remove overlay + grid + helper ids
    clone.querySelector('#__overlay')?.remove();
    clone.querySelector('#__grid')?.remove();
    const content = clone.querySelector('#__content');
    const out = mk('svg',{xmlns:SVGNS,width:state.w,height:state.h,viewBox:`0 0 ${state.w} ${state.h}`});
    if(state.bgOn){ out.appendChild(mk('rect',{x:0,y:0,width:state.w,height:state.h,fill:state.bg})); }
    while(content.firstChild){ const n=content.firstChild; if(n.dataset) delete n.dataset.rot; out.appendChild(n); }
    // clean up display none
    out.querySelectorAll('[style*="display: none"]').forEach(n=>n.remove());
    return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(out);
  }
  function download(name, data, type){
    const blob=new Blob([data],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  document.getElementById('exportSvgBtn').onclick=()=>{ deselect(); download('zeichnung.svg', serialize(), 'image/svg+xml'); flash('SVG gespeichert ✓'); };
  document.getElementById('exportPngBtn').onclick=()=>{
    deselect();
    const svgData=serialize();
    const img=new Image();
    const scale=2;
    const blob=new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=state.w*scale; c.height=state.h*scale;
      const ctx=c.getContext('2d'); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
      c.toBlob(b=>{ download('zeichnung.png', b, 'image/png'); URL.revokeObjectURL(url); flash('PNG gespeichert ✓'); });
    };
    img.onerror=()=>{ flash('PNG-Export fehlgeschlagen'); URL.revokeObjectURL(url); };
    img.src=url;
  };

  // ---------- Import ----------
  document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
  document.getElementById('fileInput').addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const doc=new DOMParser().parseFromString(ev.target.result,'image/svg+xml');
        const root=doc.querySelector('svg');
        if(!root) throw new Error('Kein SVG');
        pushUndo();
        // set canvas size from viewBox or width/height
        const vb=root.getAttribute('viewBox');
        if(vb){ const [,,w,h]=vb.split(/[\s,]+/).map(Number); if(w&&h){ state.w=Math.round(w); state.h=Math.round(h);} }
        else { const w=parseFloat(root.getAttribute('width')), h=parseFloat(root.getAttribute('height')); if(w&&h){state.w=Math.round(w);state.h=Math.round(h);} }
        document.getElementById('canvasW').value=state.w; document.getElementById('canvasH').value=state.h;
        gContent.innerHTML='';
        [...root.childNodes].forEach(n=>{
          if(n.nodeType===1 && !['title','desc','defs','metadata'].includes(n.tagName)){
            const imp=document.importNode(n,true);
            if(!imp.id) imp.id=uid();
            gContent.appendChild(imp);
          }
        });
        deselect(); applyCanvasSize(); fitZoom(); flash('SVG geladen ✓');
      }catch(err){ alert('Konnte SVG nicht laden: '+err.message); }
    };
    reader.readAsText(file);
    e.target.value='';
  });

  // ---------- Sample content ----------
  function sample(){
    const items=[
      mk('rect',{id:uid(),x:80,y:120,width:180,height:180,rx:24,fill:'#7b5cff'}),
      mk('ellipse',{id:uid(),cx:420,cy:200,rx:110,ry:80,fill:'#ff6ba6'}),
      mk('polygon',{id:uid(),points:polyPoints(620,210,90,5,-Math.PI/2,true),fill:'#ffd23f',stroke:'#ff8a3d','stroke-width':4,'stroke-linejoin':'round'}),
      mk('path',{id:uid(),d:'M 120 430 Q 250 320 380 430 T 640 430',fill:'none',stroke:'#22c1a6','stroke-width':10,'stroke-linecap':'round'}),
    ];
    const t=mk('text',{id:uid(),x:120,y:520,'font-size':52,'font-family':'Nunito, sans-serif','font-weight':800,fill:'#1e1140'});
    t.textContent='Los geht’s! ✏️';
    items.push(t);
    items.forEach(i=>gContent.appendChild(i));
    renderLayers();
  }

  // ---------- Init ----------
  applyCanvasSize();
  refreshControls();
  sample();
  setTool('select');
  setTimeout(fitZoom, 50);
  flash('Willkommen! Wähle links ein Werkzeug und leg los 🎨');
})();
</script>
</body>
</html>
