function collect(root){

function idle(){if(READ){go.textContent="JSON EINFÜGEN";go.className="hot"}else{go.textContent="STRG + V";go.className="arm"}}
function fail(){go.textContent="× PARSE";go.className="err";setTimeout(idle,1800)}
function empty(){DB=null;out.innerHTML='<div class="empty">STRG + V</div>';go.textContent="× LEER";go.className="err";setTimeout(idle,1800)}

function tally(arr,fn){
  var m={},i,v;
  for(i=0;i<arr.length;i++){var ks=fn(arr[i]);if(!Array.isArray(ks))ks=[ks];
    for(var j=0;j<ks.length;j++){v=ks[j];if(v)m[v]=(m[v]||0)+1}}
  return Object.keys(m).map(function(k){return{k:k,n:m[k]}}).sort(function(a,b){return b.n-a.n||(a.k<b.k?-1:1)});
}
var ORD={prio:["CRITICAL","HIGH","MEDIUM","LOW","UNSPECIFIED"]};
var NUM=["null","ein","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf"];
function nw(n,f){return n<NUM.length?(n===1&&f?"eine":NUM[n]):String(n)}
function nn(n,one,many,f){return n===1?(f?"eine ":"ein ")+one:nw(n,f)+" "+many}
function az(n,s1,pl){return n===1?s1:nw(n)+" "+pl}
var OSN={DARWIN:"macOS",MAC_OS:"macOS",MACOS:"macOS",WINDOWS:"Windows",WIN:"Windows",LINUX:"Linux"};
function P2(n){return String(n).padStart(2,"0")}
function dstr(d){return d?P2(d.getDate())+"."+P2(d.getMonth()+1)+"."+d.getFullYear():""}
function tstr(d){return d?P2(d.getHours())+":"+P2(d.getMinutes()):""}
function when(d){return d?"am "+dstr(d)+" um "+tstr(d)+" Uhr":""}
function seit(ms){
  if(ms==null||!isFinite(ms)||ms<0)return "";
  var m=Math.round(ms/6e4);
  if(m<60)return "seit "+nn(m,"Minute","Minuten",true);
  var h=Math.round(m/60);
  if(h<36)return "seit "+nn(h,"Stunde","Stunden",true);
  var d=Math.round(h/24);
  return "seit "+nn(d,"Tag","Tagen");
}
function liste(a,und){
  if(!a.length)return "";
  if(a.length===1)return a[0];
  return a.slice(0,-1).join(", ")+" "+(und||"und")+" "+a[a.length-1];
}
function q(s){return "\u201e"+s+"\u201c"}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
var STN={OPEN:"offen",INVESTIGATING:"in Bearbeitung",WAITING:"wartend",CLOSED:"abgeschlossen"};
function pp(t){return "<p>"+t+"</p>"}

var TOOL=[
 [/^(ngrok|cloudflared|frpc|frps|chisel|localtunnel|pagekite|zrok)(\.exe)?$/i,
  "baut einen Tunnel ins Internet auf, über den Dienste dieses Rechners von außen erreichbar werden. Das umgeht die Firewall."],
 [/^(teamviewer|anydesk|rustdesk|screenconnect|splashtop|logmein|atera|ultravnc|vncserver)/i,
  "ist eine Fernwartungs-Software. Damit kann jemand von außen den Rechner bedienen."],
 [/^(mimikatz|lazagne|procdump|secretsdump|pwdump)/i,
  "dient dazu, Passwörter und Anmeldedaten aus dem Rechner auszulesen. Dafür gibt es im Normalbetrieb keinen Grund."],
 [/^(certutil|bitsadmin|mshta|regsvr32|rundll32|wmic|msbuild|installutil|cscript|wscript)(\.exe)?$/i,
  "ist zwar ein Windows-Bordmittel, wird aber häufig zweckentfremdet, um Schadcode nachzuladen und auszuführen."],
 [/^(nc|ncat|netcat|socat)(\.exe)?$/i,
  "ist ein Netzwerk-Werkzeug, mit dem sich auch Fernsteuerungs-Verbindungen nach außen aufbauen lassen."],
 [/^(psexec|paexec|psexesvc)(\.exe)?$/i,
  "führt Befehle auf anderen Rechnern im Netz aus und wird häufig zur Ausbreitung genutzt."]
];
var CMDF=[
 [/-enc(odedcommand)?\s|frombase64string|::frombase64/i,"Die Kommandozeile ist kodiert, der eigentliche Befehl also absichtlich unlesbar gemacht."],
 [/-w(indowstyle)?\s+hidden|-nop\b|-noprofile/i,"Der Aufruf ist so gebaut, dass kein Fenster erscheint."],
 [/iex\s|invoke-expression|downloadstring/i,"Der Befehl lädt Code aus dem Netz und führt ihn sofort aus, ohne ihn zu speichern."],
 [/(curl|wget)\s[^|]*\|\s*(ba)?sh/i,"Der Befehl lädt ein Skript aus dem Netz und führt es sofort aus."],
 [/\/dev\/tcp\//i,"Der Befehl enthält ein typisches Muster für eine Rückwärts-Verbindung zu einem fremden Rechner."]
];
var TMPP=/(^|[\/\\])(tmp|temp|downloads|public|programdata)([\/\\]|$)/i;
var PERS=/launchagents|launchdaemons|[\/\\]cron|\\run\\|\\runonce\\|startup/i;

function befund(e){
  var o=[],i,pn=S(e.proc),cm=S(e.cmd);
  for(i=0;i<TOOL.length;i++)if(TOOL[i][0].test(pn)){o.push({k:"tool",t:pn+" "+TOOL[i][1],w:1});break}
  for(i=0;i<CMDF.length;i++)if(CMDF[i][0].test(cm)){o.push({k:"cmd"+i,t:CMDF[i][1],w:1});break}
  if(e.exe&&TMPP.test(e.exe))o.push({k:"tmp",t:"Das Programm liegt in einem temporären oder Download-Verzeichnis statt dort, wo installierte Software normalerweise liegt.",w:1});
  if(e.file&&PERS.test(e.file))o.push({k:"pers",t:"Es wird in einen Autostart-Pfad geschrieben. Das sorgt dafür, dass etwas nach einem Neustart wieder anläuft.",w:1});
  if(/^(root|system)$/i.test(S(e.user)))o.push({k:"root",t:"Der Vorgang lief mit vollen Systemrechten.",w:1});
  if(e.dip&&priv(e.dip)===false)o.push({k:"net",t:"Es ging eine Verbindung nach außen zu "+e.dip+(e.dport?", Port "+e.dport:"")+".",w:1});
  return o;
}
function repSatz(e){
  if(!e.rep)return "";
  var m=/^(\d+)\/(\d+)$/.exec(e.eng),hit=m?+m[1]:null,all=m?+m[2]:null,schwach=(hit!=null&&all&&hit/all<0.35)||e.rel==="LOW";
  var was=e.rep==="MALICIOUS"?"als schädlich":e.rep==="SUSPICIOUS"?"als verdächtig":e.rep==="BENIGN"?"als unbedenklich":"als unbekannt";
  if(e.rep==="BENIGN"||e.rep==="UNKNOWN"||e.rep==="GOOD")return "Die Datei ist "+was+" eingestuft.";
  var t="Rapid7 stuft die Datei "+was+" ein";
  if(e.fam||e.cls)t+=" und ordnet sie "+(e.cls?e.cls.toLowerCase().indexOf("trojan")===0?"dem Trojaner":"der Kategorie "+e.cls:"der Familie")+" "+(e.fam||e.cls)+" zu";
  t+=".";
  if(hit!=null&&all)t+=" Von "+all+" Prüf-Engines schlagen allerdings nur "+hit+" an";
  if(schwach){
    t+=(hit!=null&&all?", und ":" Allerdings ");
    t+="Rapid7 bewertet die eigene Einschätzung selbst als wenig verlässlich. Ein Fehlalarm ist gut möglich.";
  }else if(hit!=null&&all)t+=".";
  return t;
}
function fragen(e,fl){
  var f=[],has=function(k){for(var i=0;i<fl.length;i++)if(fl[i].k===k)return true;return false};
  if(has("tool"))f.push("ob "+e.proc+" für "+(e.user||"diesen Nutzer")+" freigegeben ist und ob die Verbindung noch läuft");
  if(has("tmp"))f.push("woher die Datei stammt");
  if(has("pers"))f.push("ob der Autostart-Eintrag gewollt ist");
  if(has("root"))f.push("wer den Vorgang mit Systemrechten ausgelöst hat");
  if(has("net"))f.push("wohin die Verbindung ging");
  if(!f.length&&e.rep==="MALICIOUS")f.push("ob die Datei auf weiteren Rechnern liegt");
  return f.length?"Zu klären ist, "+liste(f,"sowie")+".":"";
}

function textEvd(l){
  if(!l.length)return "";
  var h="",i;
  if(l.length===1){
    var e=l[0],s="";
    s="Auf dem Rechner <b>"+esc(e.host||"(ohne Namen)")+"</b>"+(OSN[e.os]?" ("+OSN[e.os]+")":"");
    if(e.user)s+=" hat der Nutzer <b>"+esc(e.user)+"</b>";
    else s+=" wurde";
    if(e.time)s+=" "+esc(when(e.time));
    if(e.proc)s+=(e.user?" das Programm <b>":" das Programm <b>")+esc(e.proc)+"</b>"+(e.user?" gestartet":" gestartet");
    else s+=" ein Ereignis ausgelöst";
    if(e.par)s+=", aufgerufen aus "+esc(e.par);
    s+=".";
    if(e.cmd)s+=" Der Befehl lautete "+esc(q(e.cmd))+".";
    h+=pp(s);
    var fl=befund(e),tool=fl.filter(function(x){return x.k==="tool"}),rest=fl.filter(function(x){return x.k!=="tool"});
    if(tool.length)h+=pp(esc(tool[0].t));
    var rs=repSatz(e);
    if(rs)h+=pp(esc(rs));
    if(rest.length)h+=pp(esc(rest.map(function(x){return x.t}).join(" ")));
    if(!tool.length&&!rs&&!rest.length)h+=pp("Auffälligkeiten sind aus den Daten nicht erkennbar.");
    var fr=fragen(e,fl);
    if(fr)h+=pp("<b>"+esc(fr)+"</b>");
    return h;
  }
  var uq=function(k){var s={};for(var j=0;j<l.length;j++)if(l[j][k])s[l[j][k]]=1;return Object.keys(s).length},
      ds=l.map(function(x){return x.time}).filter(Boolean),
      mn=ds.length?new Date(Math.min.apply(null,ds)):null,mx=ds.length?new Date(Math.max.apply(null,ds)):null,
      bad=l.filter(function(x){return x.rep==="MALICIOUS"||x.rep==="SUSPICIOUS"}),
      na=uq("host"),nu=uq("user");
  var s1="Die Daten enthalten "+az(l.length,"einen Vorgang","Vorgänge")+" von "+az(na,"einem Rechner","Rechnern");
  if(nu)s1+=" und "+az(nu,"einem Benutzerkonto","Benutzerkonten");
  if(mn&&mx)s1+=", "+(dstr(mn)===dstr(mx)?"alle am "+dstr(mn)+" zwischen "+tstr(mn)+" und "+tstr(mx)+" Uhr":"vom "+dstr(mn)+" bis "+dstr(mx));
  h+=pp(esc(s1)+".");
  if(bad.length){
    var bh={};bad.forEach(function(x){if(x.host)bh[x.host]=1});
    h+=pp("Bei "+nw(bad.length)+" davon stuft Rapid7 die beteiligte Datei als schädlich oder verdächtig ein"+
      (Object.keys(bh).length>1?", verteilt auf "+nw(Object.keys(bh).length)+" Rechner":"")+".");
  }
  var agg={},ord=[];
  for(i=0;i<l.length;i++){var fs=befund(l[i]);
    for(var j=0;j<fs.length;j++){var k=fs[j].k;
      if(!agg[k]){agg[k]={t:fs[j].t,n:0,who:{},proc:{}};ord.push(k)}
      agg[k].n++;if(l[i].host)agg[k].who[l[i].host]=1;if(l[i].proc)agg[k].proc[l[i].proc]=1}}
  if(ord.length){
    for(i=0;i<ord.length&&i<6;i++){var a=agg[ord[i]],wq=Object.keys(a.who).length;
      h+=pp(esc(a.t+" Das betrifft "+az(a.n,"einen Vorgang","Vorgänge")+(wq>1?" auf "+nw(wq)+" Rechnern":"")+"."))}
  }else h+=pp("Auffälligkeiten sind aus den Daten nicht erkennbar.");
  var tp=tally(l,function(x){return x.proc?x.proc:[]});
  if(tp.length>1)h+=pp("Am häufigsten kommen die Programme "+esc(liste(tp.slice(0,4).map(function(x){return x.k}),"sowie"))+" vor.");
  return h;
}

function textInv(l,al){
  if(!l.length)return "";
  var h="",i,open=l.filter(function(v){return v.status&&v.status!=="CLOSED"}),
      closed=l.filter(function(v){return v.status==="CLOSED"}),
      un=l.filter(function(v){return !v.asg}),
      mal=l.filter(function(v){return v.disp==="MALICIOUS"}),
      ds=l.map(function(v){return v.created}).filter(Boolean),
      mn=ds.length?new Date(Math.min.apply(null,ds)):null,mx=ds.length?new Date(Math.max.apply(null,ds)):null;
  var s1="Die Daten enthalten "+nn(l.length,"Investigation","Investigations",true);
  if(mn&&mx&&dstr(mn)!==dstr(mx))s1+=" aus dem Zeitraum "+dstr(mn)+" bis "+dstr(mx);
  else if(mn)s1+=" vom "+dstr(mn);
  s1+=". "+(open.length?nw(open.length,true).charAt(0).toUpperCase()+nw(open.length,true).slice(1)+" davon "+(open.length===1?"ist":"sind")+" noch offen":"Alle sind abgeschlossen");
  if(closed.length&&open.length)s1+=", "+nw(closed.length)+" "+(closed.length===1?"ist":"sind")+" abgeschlossen";
  h+=pp(esc(s1)+".");
  var hot=open.filter(function(v){return v.prio==="CRITICAL"||v.prio==="HIGH"})
    .sort(function(a,b){var x=ORD.prio.indexOf(a.prio),y=ORD.prio.indexOf(b.prio);return (x<0?9:x)-(y<0?9:y)||(b.age||0)-(a.age||0)});
  if(hot.length){
    for(i=0;i<hot.length&&i<4;i++){var v=hot[i],z=[];
      if(v.age!=null)z.push(seit(v.age)+" offen");
      if(v.status&&v.status!=="OPEN")z.push("Status "+(STN[v.status]||v.status.toLowerCase()));
      z.push(v.asg?"bearbeitet von "+v.asg:"niemandem zugewiesen");
      h+=pp((i===0?"<b>Am dringendsten</b> ist ":"Dazu kommt ")+
        (v.prio==="CRITICAL"?"ein als kritisch eingestufter Fall":"ein als hoch eingestufter Fall")+": "+
        esc(q(v.title||tail(v.rrn)))+" — "+esc(liste(z))+".")}
    if(hot.length>4)h+=pp(esc(hot.length-4===1?"Dazu kommt ein weiterer Fall mit hoher oder kritischer Einstufung.":"Dazu kommen "+nw(hot.length-4)+" weitere Fälle mit hoher oder kritischer Einstufung."));
  }else if(open.length)h+=pp("Keiner der offenen Fälle ist als hoch oder kritisch eingestuft.");
  var w=[];
  if(un.length&&open.length)w.push(nw(un.length)+" von "+nw(l.length)+" Fällen "+(un.length===1?"hat":"haben")+" keinen Bearbeiter");
  var stale=open.filter(function(v){return v.acc&&Date.now()-v.acc>6048e5});
  if(stale.length)w.push(nn(stale.length,"offener Fall","offene Fälle")+" "+(stale.length===1?"wurde":"wurden")+" seit über einer Woche nicht mehr angefasst");
  if(mal.length)w.push(nn(mal.length,"Fall","Fälle")+" "+(mal.length===1?"wurde":"wurden")+" als bösartig bewertet"+(mal.length<=2?": "+mal.map(function(v){return q(v.title||tail(v.rrn))}).join(", "):""));
  if(w.length)h+=pp(esc(cap(liste(w))+"."));
  return h;
}

function textRest(){
  var p=[];
  if(DB.ev.length)p.push(az(DB.ev.length,"einen Beweismittel-Eintrag","Beweismittel-Einträge"));
  if(DB.com.length)p.push(az(DB.com.length,"einen Kommentar","Kommentare"));
  if(DB.raw.length)p.push(az(DB.raw.length,"eine Log-Zeile","Log-Zeilen"));
  if(DB.att.length)p.push(az(DB.att.length,"einen Anhang","Anhänge"));
  if(!p.length)return "";
  var h=pp((DB.inv.length||DB.evd.length?"Mitgeliefert sind außerdem ":"Die Daten enthalten ")+esc(liste(p))+".");
  if(!DB.inv.length&&!DB.evd.length&&DB.com.length){
    for(var i=0;i<DB.com.length&&i<6;i++){var c=nmap(DB.com[i]),cr=sub(c.creator),b=S(c.body);
      if(b)h+=pp(esc((S(cr.name)?S(cr.name)+" schrieb":"Notiz")+(D(c.createdtime)?" "+when(D(c.createdtime)):"")+": "+q(b)))}}
  return h;
}
function textWarn(){
  var w=[];
  if(DB.pg&&DB.pg.totaldata!=null&&DB.inv.length&&DB.pg.totaldata>DB.inv.length)
    w.push("Achtung: die Schnittstelle meldet insgesamt "+DB.pg.totaldata+" Datensätze, hier liegen nur "+DB.inv.length+" davon vor. Das ist ein Auszug, kein vollständiges Bild.");
  if(DB.lost)w.push(DB.lost===1?"Achtung: ein Abschnitt im eingefügten JSON war beschädigt und konnte nicht gelesen werden.":"Achtung: "+nw(DB.lost)+" Abschnitte im eingefügten JSON waren beschädigt und konnten nicht gelesen werden.");
  if(DB.fix)w.push("Das JSON war fehlerhaft und wurde vor der Auswertung repariert.");
  return w.length?pp('<span class="w">'+esc(w.join(" "))+"</span>"):"";
}

function render(){
  if(!DB)return;
  var t=textInv(DB.inv,DB.alr)+textEvd(DB.evd)+textRest()+textWarn();
  out.innerHTML=t?'<div class="sum">'+t+"</div>":'<div class="empty">STRG + V</div>';
}

var SEQ=0,FILE=location.protocol==="file:",READ=!FILE;
function canRead(){
  if(!(navigator.clipboard&&navigator.clipboard.readText))return Promise.resolve(false);
  if(!navigator.permissions||!navigator.permissions.query)return Promise.resolve(!FILE);
  return navigator.permissions.query({name:"clipboard-read"}).then(
    function(s){return s.state==="granted"||(s.state==="prompt"&&!FILE)},
    function(){return !FILE});
}
go.addEventListener("click",function(){
  var my=++SEQ;
  canRead().then(function(ok){
    READ=ok;
    if(my!==SEQ)return;
    if(!ok)return arm();
    var done=false,to=setTimeout(function(){if(!done&&my===SEQ)arm()},1200);
    navigator.clipboard.readText().then(function(t){
      done=true;clearTimeout(to);if(my!==SEQ)return;
      if(t&&t.trim())ingest(t);else arm();
    },function(){done=true;clearTimeout(to);if(my===SEQ)arm()});
  });
});
function arm(){go.textContent="STRG + V";go.className="arm";sink.value="";sink.focus()}
document.addEventListener("paste",function(e){
  var t=(e.clipboardData||window.clipboardData);if(!t)return;
  var v=t.getData("text");if(!v||!v.trim())return;
  e.preventDefault();SEQ++;sink.value="";ingest(v);
});
canRead().then(function(ok){READ=ok;if(!DB)idle()});
out.innerHTML='<div class="empty">STRG + V</div>';
sink.focus();
})();
</script>
