<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDR Investigation Analyzer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{

--fg:#e2e2e2;--mut:#787878;--dim:#454545;
--crit:#ff2f2f;--high:#ff8c00;--med:#e3c000;--low:#3aa757;--none:#4a4a4a;

}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;-webkit-font-smoothing:antialiased;padding-bottom:60px}
::selection{background:#2a2a2a}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#1f1f1f}
::-webkit-scrollbar-track{background:#000}

.brand{font-size:12px;letter-spacing:.22em;color:#fff}
.meta{color:var(--dim);font-size:11px;display:flex;gap:16px;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.meta span{display:inline-flex;gap:6px}
.meta b{color:var(--mut);font-weight:400}
.meta b.wfix{color:var(--med)}
.meta b.wlost{color:var(--bad)}
button{font:inherit;background:#0e0e0e;color:var(--fg);border:1px solid var(--line2);padding:5px 12px;cursor:pointer;letter-spacing:.08em}
button:hover{background:#171717;border-color:#3a3a3a}
button:active{background:#050505}
button.hot{border-color:#4a4a4a;color:#fff}
button.arm{border-color:#5f5f5f;color:#fff;background:#1a1a1a}
button.err{border-color:var(--bad);color:var(--bad)}
input.f{font:inherit;background:#0a0a0a;color:var(--fg);border:1px solid var(--line2);padding:5px 9px;width:180px;outline:none}
input.f:focus{border-color:#3a3a3a}
input.f::placeholder{color:#3a3a3a}
#sink{position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px}

main{padding:0 16px}
.wrap{max-width:1720px;margin:0 auto}
section{margin-top:16px}
h2{font-size:10px;font-weight:400;letter-spacing:.2em;color:var(--dim);padding:0 0 7px;text-transform:uppercase}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#101010;border:1px solid var(--line2);padding:3px 8px;cursor:pointer;font-size:11px}
.chip:hover{border-color:#4a4a4a}
.chip s{color:var(--dim);text-decoration:none}
.chip em{font-style:normal;color:var(--mut)}

.kpi{background:var(--pnl);padding:11px 13px;border:1px solid var(--line);border-width:0 1px 1px 0}
.kpi b{display:block;font-size:22px;font-weight:400;line-height:1.15;letter-spacing:-.02em}
.kpi span{display:block;font-size:10px;letter-spacing:.14em;color:var(--dim);margin-top:3px}
.kpi small{display:block;font-size:10px;color:var(--dim);margin-top:1px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));border:1px solid var(--line);border-width:1px 0 0 1px}
.pnl{background:var(--pnl);padding:11px 13px 13px;border:1px solid var(--line);border-width:0 1px 1px 0}
.pnl h3{font-size:10px;font-weight:400;letter-spacing:.18em;color:var(--dim);margin-bottom:9px;display:flex;justify-content:space-between}
.pnl h3 i{font-style:normal;color:#2e2e2e}
.r{display:grid;grid-template-columns:1fr 48px 32px 34px;align-items:center;gap:8px;padding:2.5px 0;cursor:pointer}
.r:hover .k{color:#fff}
.r.on .k{color:#fff}
.r.on .bar b{background:#8a8a8a}
.k{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.bar{background:#131313;height:5px;position:relative}
.bar b{position:absolute;left:0;top:0;bottom:0;background:#3a3a3a;min-width:1px}
.n{text-align:right;color:var(--fg)}
.p{text-align:right;color:var(--dim);font-size:11px}
.dot{width:6px;height:6px;flex:0 0 6px;background:var(--none);display:inline-block}
.dot.CRITICAL{background:var(--crit)}.dot.HIGH{background:var(--high)}.dot.MEDIUM{background:var(--med)}.dot.LOW{background:var(--low)}
.dot.OPEN{background:var(--crit)}.dot.INVESTIGATING{background:var(--high)}.dot.WAITING{background:var(--med)}.dot.CLOSED{background:#3a3a3a}
.dot.MALICIOUS{background:var(--crit)}.dot.BENIGN{background:var(--low)}.dot.UNDECIDED{background:var(--med)}

.tl{background:var(--pnl);border:1px solid var(--line);padding:13px}
.tlb{display:flex;align-items:flex-end;justify-content:space-between;gap:1px;height:104px}
.tlb i{flex:1 1 0;min-width:1px;max-width:34px;background:#2f2f2f;position:relative}
.tlb i:hover{background:#6f6f6f}
.tlb i u{position:absolute;left:0;right:0;bottom:0;background:var(--crit)}
.tlx{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;margin-top:7px}

.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--pnl)}
.tw{border:1px solid var(--line);overflow:auto;max-height:calc(100vh - var(--hh,42px) - 58px)}
.tbl th{font-weight:400;text-align:left;font-size:10px;letter-spacing:.13em;color:var(--dim);padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:#0c0c0c;z-index:10}
.tbl th:hover{color:var(--mut)}
.tbl th.s:after{content:"↓";margin-left:5px;color:#555}
.tbl th.s.a:after{content:"↑"}
.tbl td{padding:5px 9px;border-bottom:1px solid #111;vertical-align:top;white-space:nowrap;max-width:460px;overflow:hidden;text-overflow:ellipsis}
.tbl tr.d:hover td{background:#0f0f0f;cursor:pointer}
.tbl tr.op td{background:#101010}
.mut{color:var(--mut)}.dimc{color:var(--dim)}
.t-CRITICAL{color:var(--crit)}.t-HIGH{color:var(--high)}.t-MEDIUM{color:var(--med)}.t-LOW{color:var(--low)}.t-UNSPECIFIED{color:var(--dim)}
.t-OPEN{color:var(--crit)}.t-INVESTIGATING{color:var(--high)}.t-WAITING{color:var(--med)}.t-CLOSED{color:var(--dim)}
.t-MALICIOUS{color:var(--crit)}.t-BENIGN{color:var(--low)}.t-UNDECIDED{color:var(--mut)}.t-NOT_APPLICABLE{color:var(--dim)}

.det{background:#050505}
.det td{padding:0;white-space:normal}
.detin{padding:12px 14px;border-left:2px solid #1f1f1f}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:3px 22px;margin-bottom:10px}
.kv div{display:flex;gap:9px;font-size:11px;border-bottom:1px solid #0f0f0f;padding:2px 0}
.kv div span:first-child{color:var(--dim);min-width:132px;flex:0 0 132px}
.kv div span:last-child{color:var(--fg);word-break:break-all}
pre{background:#0a0a0a;border:1px solid var(--line);padding:10px;overflow:auto;max-height:340px;color:#9a9a9a;font-size:11px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.sub{border:1px solid var(--line);margin-bottom:10px}
.sub table{width:100%;border-collapse:collapse;font-size:11px}
.sub th{background:#0a0a0a;color:var(--dim);font-weight:400;text-align:left;padding:5px 8px;font-size:10px;letter-spacing:.1em;position:static}
.sub td{padding:4px 8px;border-top:1px solid #101010;color:var(--mut)}

.ioc{display:flex;flex-wrap:wrap;gap:5px}
.ioc span{background:#0f0f0f;border:1px solid var(--line);padding:2px 7px;cursor:pointer;font-size:11px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ioc span:hover{border-color:#444;color:#fff}
.ioc span em{font-style:normal;color:#333;margin-left:6px}
.ioc span.pub{color:#d0d0d0}
.ioc span.cp{border-color:var(--ok);color:var(--ok)}

.empty{display:flex;align-items:center;justify-content:center;height:66vh;color:#2b2b2b;font-size:12px;letter-spacing:.34em}
.hide{display:none}
</style>
</head>

var RX={
  ip:/\b(?:\d{1,3}\.){3}\d{1,3}\b/g,
  h256:/\b[a-fA-F0-9]{64}\b/g,h1:/\b[a-fA-F0-9]{40}\b/g,md5:/\b[a-fA-F0-9]{32}\b/g,
  mail:/\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,24}\b/g,

function priv(ip){var p=ip.split(".").map(Number);
  if(p.some(function(n){return isNaN(n)||n>255}))return null;
  if(p[0]===10||p[0]===127||(p[0]===192&&p[1]===168)||(p[0]===172&&p[1]>=16&&p[1]<=31)||(p[0]===169&&p[1]===254)||p[0]===0||p[0]>=224)return true;
  return false;
}
function iocs(txt){
  var o={ip:{},pip:{},dom:{},mail:{},url:{},hash:{}},i,rest=txt;
  var ips=txt.match(RX.ip)||[];
  for(i=0;i<ips.length;i++){var pv=priv(ips[i]);if(pv===null)continue;var t=pv?o.pip:o.ip;t[ips[i]]=(t[ips[i]]||0)+1}
  var us=txt.match(RX.url)||[],hosts=[];
  for(i=0;i<us.length;i++){var u=us[i].replace(/[.,;]+$/,"");o.url[u]=(o.url[u]||0)+1;
    var hm=/^https?:\/\/(?:[^@/\s]*@)?([^/:?#\s]+)/i.exec(u);if(hm)hosts.push(hm[1].toLowerCase())}
  var ms=txt.match(RX.mail)||[];
  for(i=0;i<ms.length;i++)o.mail[ms[i]]=(o.mail[ms[i]]||0)+1;
  ["h256","h1","md5"].forEach(function(k){var hs=txt.match(RX[k])||[];for(var j=0;j<hs.length;j++){var v=hs[j].toLowerCase();if(/^\d+$/.test(v))continue;o.hash[v]=(o.hash[v]||0)+1}});
  rest=rest.replace(RX.url," ").replace(RX.mail," ").replace(RX.ip," ");
  var ds=(rest.match(RX.dom)||[]).concat(hosts);
  for(i=0;i<ds.length;i++){var d=ds[i].toLowerCase();
    if(SKIP.test(d))continue;
    if(!/\.[a-z]{2,}$/.test(d))continue;
    o.dom[d]=(o.dom[d]||0)+1}
  return o;
}

    if(ks.indexOf(dims[i][1]||"—")<0)return false}
  if(skip!=="tag"){var tk=Object.keys(F.tag);if(tk.length){var hit=false;for(var t=0;t<v.tags.length;t++)if(tk.indexOf(v.tags[t])>=0)hit=true;if(!hit)return false}}

      if(fx&&(!g.f||fx<g.f))g.f=fx;if(lx&&(!g.l||lx>g.l))g.l=lx}
    for(var z=0;z<ag.length;z++){var kk=ag[z].k,gg=grp[kk];
      H+='<tr><td>'+esc(kk)+'</td><td>'+gg.n+'</td><td class="mut">'+esc(Object.keys(gg.src).join(", ")||"—")+'</td><td class="dimc">'+esc(Object.keys(gg.rule).slice(0,3).join(", ")||"—")+'</td><td class="mut">'+esc(fdt(gg.f))+'</td><td class="mut">'+esc(fdt(gg.l))+'</td></tr>'}
    H+="</tbody></table></div></section>";
  }

  if(DB.ev.length){
    H+='<section><h2>Evidence</h2><div class="tw"><table class="tbl"><thead><tr><th>ZEIT</th><th>QUELLE</th><th>TYP</th><th>DATEN</th></tr></thead><tbody>';
    for(var e=0;e<DB.ev.length;e++){var ev=DB.ev[e],dt=D(ev.evented_at||ev.created_at||ev.timestamp),op2=OPEN["e"+e],dd=ev.data;
      var flat=typeof dd==="string"?dd:JSON.stringify(dd||ev);
      H+='<tr class="d'+(op2?" op":"")+'" data-e="'+e+'"><td class="mut">'+esc(fdt(dt))+'</td><td>'+esc(nz(S(ev.external_source)))+'</td><td class="mut">'+esc(nz(S(ev.event_type)))+'</td><td class="dimc">'+esc(flat.slice(0,180))+"</td></tr>";
      if(op2){var pd=dd;if(typeof dd==="string"){try{pd=JSON.parse(dd)}catch(x){}}
        H+='<tr class="det"><td colspan="4"><div class="detin">'+(pd&&typeof pd==="object"?kvlist(pd):"")+'<pre>'+esc(JSON.stringify(pd&&typeof pd==="object"?pd:ev,null,2))+"</pre></div></td></tr>"}}
    H+="</tbody></table></div></section>";
  }

  if(DB.com.length){
    H+='<section><h2>Kommentare</h2><div class="tw"><table class="tbl"><thead><tr><th>ZEIT</th><th>AUTOR</th><th>SICHTBARKEIT</th><th>TEXT</th></tr></thead><tbody>';
    for(var m2=0;m2<DB.com.length;m2++){var cm=DB.com[m2],cr=cm.creator||{};
      H+='<tr><td class="mut">'+esc(fdt(D(cm.created_time)))+'</td><td>'+esc(nz(S(cr.name)))+'</td><td class="dimc">'+esc(nz(S(cm.visibility)))+'</td><td style="white-space:normal">'+esc(S(cm.body))+"</td></tr>"}
    H+="</tbody></table></div></section>";
  }

  if(DB.raw.length){
    H+='<section><h2>Log Events</h2><div class="tw"><table class="tbl"><thead><tr><th>ZEIT</th><th>HOST</th><th>APP</th><th>ZEILE</th></tr></thead><tbody>';
    for(var r2=0;r2<Math.min(DB.raw.length,500);r2++){var rw=DB.raw[r2];
      H+='<tr><td class="mut">'+esc(fdt(D(rw.timestamp||rw.time)))+'</td><td>'+esc(nz(S(rw.hostname||rw.host)))+'</td><td class="mut">'+esc(nz(S(rw.appname||rw.app)))+'</td><td class="dimc">'+esc(S(rw.source_data||rw.message||JSON.stringify(rw)).slice(0,220))+"</td></tr>"}
    H+="</tbody></table></div></section>";
  }

  out.innerHTML=H||'<div class="empty">STRG + V</div>';
}
function kpi(v,l,s){return '<div class="kpi"><b>'+esc(v)+'</b><span>'+esc(l)+'</span><small>'+esc(s||"")+"</small></div>"}
function pct(n,t){return t?Math.round(n/t*100)+"%":""}
function chipbar(){
  var h="",any=false,names={prio:"prio",status:"status",disp:"disp",src:"src",asg:"asg",tag:"tag",atype:"alert",asrc:"src"};
  for(var d in F)for(var v in F[d]){any=true;
    h+='<span class="chip" data-x="'+d+'" data-v="'+esc(v)+'"><em>'+names[d]+'</em>'+esc(v)+'<s>×</s></span>'}

document.addEventListener("click",function(e){
  if(!e.target||!e.target.closest)return;
  var r=e.target.closest(".r");
  if(r){var d=r.dataset.dim,v=r.dataset.v;if(F[d][v])delete F[d][v];else F[d][v]=1;render();return}
  var c=e.target.closest(".chip");
  if(c){if(c.dataset.x==="q"){Q="";qin.value=""}else delete F[c.dataset.x][c.dataset.v];render();return}
  var th=e.target.closest("th[data-k]");
  if(th){var k=th.dataset.k;if(SORT.k===k)SORT.a=!SORT.a;else{SORT.k=k;SORT.a=!!ASC[k]}render();return}
  var tr=e.target.closest("tr.d");
  if(tr){var key=tr.dataset.i!=null?"i"+tr.dataset.i:"e"+tr.dataset.e;
    if(OPEN[key])delete OPEN[key];else OPEN[key]=1;render();return}
  var ip=e.target.closest("[data-cp]");
  if(ip){var t=ip.dataset.cp;
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t);
    ip.classList.add("cp");setTimeout(function(){ip.classList.remove("cp")},700)}
});

qin.addEventListener("input",reQ);

  if(!DB)return;

  for(var i=0;i<rows.length;i++){var v=rows[i];

      .map(function(x){x=S(x)||String(x==null?"":x);return /[";\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(";"))}
  var b=new Blob(["﻿"+L.join("\r\n")],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="investigations.csv";a.click();setTimeout(function(){URL.revokeObjectURL(u)},2000);

var SEQ=0,FILE=location.protocol==="file:",READ=!FILE;
function canRead(){
  if(!(navigator.clipboard&&navigator.clipboard.readText))return Promise.resolve(false);
  if(!navigator.permissions||!navigator.permissions.query)return Promise.resolve(!FILE);
  return navigator.permissions.query({name:"clipboard-read"}).then(
    function(s){return s.state==="granted"||(s.state==="prompt"&&!FILE)},
    function(){return !FILE});
}
go.addEventListener("click",function(){
  var my=++SEQ;
  canRead().then(function(ok){
    READ=ok;
    if(my!==SEQ)return;
    if(!ok)return arm();
    var done=false,to=setTimeout(function(){if(!done&&my===SEQ)arm()},1200);
    navigator.clipboard.readText().then(function(t){
      done=true;clearTimeout(to);if(my!==SEQ)return;
      if(t&&t.trim())ingest(t);else arm();
    },function(){done=true;clearTimeout(to);if(my===SEQ)arm()});
  });
});
function arm(){go.textContent="STRG + V";go.className="arm";sink.value="";sink.focus()}
document.addEventListener("paste",function(e){
  var t=(e.clipboardData||window.clipboardData);if(!t)return;
  var v=t.getData("text");if(!v||!v.trim())return;
  if(document.activeElement===qin)return;
  e.preventDefault();SEQ++;sink.value="";ingest(v);
});
canRead().then(function(ok){READ=ok;if(!DB)idle()});
out.innerHTML='<div class="empty">STRG + V</div>';
sink.focus();
})();
